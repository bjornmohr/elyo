openapi: 3.0.3
info:
  title: ELYO API
  description: API for the ELYO health platform (Migrated from Next.js to Laravel)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Employee
    description: Endpoints for employees (check-ins, dashboard)
  - name: Company
    description: Endpoints for company admins and managers
  - name: Partner
    description: Endpoints for external partners
  - name: Admin
    description: ELYO platform administration
  - name: Measures
    description: Company health measures
  - name: Points
    description: Gamification and points system
  - name: Reports
    description: Data and PDF reports
  - name: Wearables
    description: Wearable device integrations
  - name: Webhooks
    description: External service webhooks
  - name: Cron
    description: Scheduled tasks

components:
  securitySchemes:
    Sanctum:
      type: http
      scheme: bearer
    PartnerSession:
      type: apiKey
      in: cookie
      name: elyo_partner_session
    CronSecret:
      type: apiKey
      in: header
      name: x-cron-secret

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE, ELYO_ADMIN] }
        isActive: { type: boolean }

    WellbeingEntry:
      type: object
      properties:
        id: { type: string }
        mood: { type: integer }
        stress: { type: integer }
        energy: { type: integer }
        score: { type: number }
        note: { type: string, nullable: true }
        periodKey: { type: string }
        createdAt: { type: string, format: date-time }

    Measure:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        suggestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    Partner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        type: { type: string }
        verificationStatus: { type: string, enum: [PENDING_DOCS, PENDING_REVIEW, VERIFIED, SUSPENDED, REJECTED] }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new company and admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 2 }
      responses:
        200:
          description: Success
        400:
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /employee/dashboard:
    get:
      tags: [Employee]
      summary: Get employee dashboard data
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest: { $ref: '#/components/schemas/WellbeingEntry', nullable: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }
                  streakCount: { type: integer }
        401:
          description: Unauthorized

  /employee/checkin:
    post:
      tags: [Employee]
      summary: Submit a wellbeing check-in
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mood: { type: integer, minimum: 1, maximum: 10 }
                stress: { type: integer, minimum: 1, maximum: 10 }
                energy: { type: integer, minimum: 1, maximum: 10 }
                note: { type: string, nullable: true }
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  score: { type: number }
                  periodKey: { type: string }

  /employee/history:
    get:
      tags: [Employee]
      summary: Get wellbeing history
      security: [{ Sanctum: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }

  /employee/profile:
    get:
      tags: [Employee]
      summary: Get employee profile
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    put:
      tags: [Employee]
      summary: Update employee profile
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        200:
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /employee/surveys:
    get:
      tags: [Employee]
      summary: List available surveys
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of surveys
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string, nullable: true }
                        questionCount: { type: integer }
                        completed: { type: boolean }
                        endsAt: { type: string, format: date-time, nullable: true }

  /employee/surveys/{surveyId}:
    get:
      tags: [Employee]
      summary: Get survey details
      security: [{ Sanctum: [] }]
      parameters:
        - name: surveyId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Survey details with questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  survey:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      description: { type: string, nullable: true }
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            text: { type: string }
                            type: { type: string }
                            order: { type: integer }
                            isRequired: { type: boolean }
                            options: { type: object, nullable: true }
                            scaleMinLabel: { type: string, nullable: true }
                            scaleMaxLabel: { type: string, nullable: true }
        404:
          description: Not found or not active
        409:
          description: Already completed

  /employee/surveys/{surveyId}/respond:
    post:
      tags: [Employee]
      summary: Submit survey responses
      security: [{ Sanctum: [] }]
      parameters:
        - name: surveyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId: { type: string }
                      scaleValue: { type: integer, nullable: true }
                      textValue: { type: string, nullable: true }
                      choiceValue: { type: string, nullable: true }
                      boolValue: { type: boolean, nullable: true }
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /partner/login:
    post:
      tags: [Partner]
      summary: Partner login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              schema: { type: string, example: 'elyo_partner_session=...; Path=/; HttpOnly' }
        401:
          description: Invalid credentials

  /partner/me:
    get:
      tags: [Partner]
      summary: Get current partner profile
      security: [{ PartnerSession: [] }]
      responses:
        200:
          description: Partner profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }

  /company/dashboard:
    get:
      tags: [Company]
      summary: Get company dashboard data
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Company metrics and trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          avgMood: { type: number }
                          avgStress: { type: number }
                          avgEnergy: { type: number }
                          avgScore: { type: number }
                          responseCount: { type: integer }
                          isAboveThreshold: { type: boolean }
                  trend:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            period: { type: string }
                            avgScore: { type: number }
                            avgMood: { type: number }
                            avgStress: { type: number }
                            avgEnergy: { type: number }
                            respondents: { type: integer }
                  teams:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            description: { type: string, nullable: true }
                            color: { type: string, nullable: true }
                            memberCount: { type: integer }
                            metrics:
                              type: object
                              properties:
                                isAboveThreshold: { type: boolean }
                                responseCount: { type: integer }
                                avgScore: { type: number }
                                avgMood: { type: number }
                                avgStress: { type: number }

  /company/teams:
    get:
      tags: [Company]
      summary: List company teams
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        color: { type: string, nullable: true }
                        memberCount: { type: integer }
                        manager: { type: object, properties: { name: { type: string } } }
    post:
      tags: [Company]
      summary: Create a new team
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                color: { type: string, maxLength: 7 }
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { id: { type: string }, name: { type: string } } }

  /company/teams/{id}:
    get:
      tags: [Company]
      summary: Get team details
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Team details
    put:
      tags: [Company]
      summary: Update team
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
      responses:
        200:
          description: Updated
    delete:
      tags: [Company]
      summary: Delete team
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: OK

  /company/teams/{teamId}/members:
    get:
      tags: [Company]
      summary: List team members
      security: [{ Sanctum: [] }]
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: List of members

  /company/surveys:
    get:
      tags: [Company]
      summary: List company surveys
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of surveys
    post:
      tags: [Company]
      summary: Create a new survey
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, questions]
              properties:
                title: { type: string }
                description: { type: string }
                questions:
                  type: array
                  items:
                    type: object
                    required: [text, type, order]
                    properties:
                      text: { type: string }
                      type: { type: string, enum: [SCALE, MULTIPLE_CHOICE, TEXT, YES_NO] }
                      order: { type: integer }
                      isRequired: { type: boolean }
                      options: { type: array, items: { type: string } }
                      scaleMinLabel: { type: string }
                      scaleMaxLabel: { type: string }
      responses:
        201:
          description: Created

  /company/surveys/{id}:
    patch:
      tags: [Company]
      summary: Update survey status or info
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Updated
    delete:
      tags: [Company]
      summary: Delete survey
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: OK

  /company/surveys/{id}/results:
    get:
      tags: [Company]
      summary: Get aggregated survey results
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Aggregated results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      survey: { type: object }
                      scope:
                        type: object
                        nullable: true
                        properties:
                          type: { type: string, enum: [company, teams] }
                          teamIds:
                            type: array
                            nullable: true
                            items: { type: integer }
                      participation:
                        type: object
                        nullable: true
                        properties:
                          eligibleCount: { type: integer }
                          responseCount: { type: integer }
                          rate: { type: number }
                      responseCount: { type: integer }
                      minRequired:
                        type: integer
                        nullable: true
                      isAboveThreshold: { type: boolean }
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId: { type: integer }
                            text: { type: string }
                            type: { type: string, enum: [SCALE, MULTIPLE_CHOICE, TEXT, YES_NO] }
                            answerCount:
                              type: integer
                              nullable: true
                              description: Null when the question-level anonymity threshold is not met.
                            avgValue:
                              type: number
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            minValue:
                              type: integer
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            maxValue:
                              type: integer
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            scaleMinLabel:
                              type: string
                              nullable: true
                            scaleMaxLabel:
                              type: string
                              nullable: true
                            isSuppressed:
                              type: boolean
                              description: True when one or more small answer buckets are hidden.
                            suppressedCount:
                              type: integer
                              nullable: true
                              description: Total answers hidden inside visible-safe suppressed buckets. Null when suppressed metadata could allow inference.
                            suppressionReason:
                              type: string
                              nullable: true
                              enum: [QUESTION_THRESHOLD_NOT_MET, DISTRIBUTION_SUPPRESSED]
                              description: Optional reason returned when a question or distribution is suppressed.
                            distribution:
                              type: array
                              description: Distribution buckets. For SCALE and MULTIPLE_CHOICE results, this is an empty array when any bucket is suppressed.
                              items:
                                type: object
                                properties:
                                  value: { type: integer }
                                  count: { type: integer }
                                  percentage: { type: number }
                            trueCount:
                              type: integer
                              nullable: true
                              description: Null when YES_NO split is suppressed.
                            falseCount:
                              type: integer
                              nullable: true
                              description: Null when YES_NO split is suppressed.
                            truePercentage:
                              type: number
                              nullable: true
                            falsePercentage:
                              type: number
                              nullable: true
                            options:
                              type: array
                              description: MULTIPLE_CHOICE options. Empty when the distribution is suppressed because any option bucket is below the anonymity threshold.
                              items:
                                type: object
                                properties:
                                  value: { type: string, nullable: true }
                                  count: { type: integer }
                                  percentage: { type: number }
        403:
          description: Threshold not met
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  minRequired: { type: integer }
                  current: { type: integer }
                  participation:
                    type: object
                    properties:
                      eligibleCount: { type: integer }
                      responseCount: { type: integer }
                      rate: { type: number }
                  isAboveThreshold: { type: boolean }

  /company/measures:
    get:
      tags: [Company]
      summary: List company measures
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of measures
    post:
      tags: [Company]
      summary: Create/Activate a measure
      security: [{ Sanctum: [] }]
      responses:
        201:
          description: Created

  /company/measures/{id}:
    patch:
      tags: [Company]
      summary: Update measure status
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Updated

  /company/reports:
    get:
      tags: [Company]
      summary: Get aggregated report trend
      security: [{ Sanctum: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
        - name: teamId
          in: query
          schema: { type: string }
      responses:
        200:
          description: Trend data

  /admin/partners:
    get:
      tags: [Admin]
      summary: List partners for review
      security: [{ Sanctum: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        200:
          description: List of partners
  /admin/partners/{id}:
    patch:
      tags: [Admin]
      summary: Update partner status
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject, suspend, unsuspend]
                rejectionReason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }
                  warning: { type: string, nullable: true }
        400:
          description: Validation or transition error
        404:
          description: Not found

  /measures:
    get:
      tags: [Measures]
      summary: List health measures
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of measures
          content:
            application/json:
              schema:
                type: object
                properties:
                  measures:
                    type: array
                    items: { $ref: '#/components/schemas/Measure' }
    post:
      tags: [Measures]
      summary: Create/Activate a measure
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, description]
              properties:
                title: { type: string, minLength: 3, maxLength: 100 }
                category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
                description: { type: string, minLength: 10, maxLength: 500 }
                teamId: { type: string, nullable: true }
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { $ref: '#/components/schemas/Measure' }

  /measures/{id}:
    patch:
      tags: [Measures]
      summary: Update measure status
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, COMPLETED, DISMISSED] }
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { $ref: '#/components/schemas/Measure' }

  /points/me:
    get:
      tags: [Points]
      summary: Get my points and level
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Points data

  /webhooks/terra:
    post:
      tags: [Webhooks]
      summary: Terra webhook receiver
      responses:
        200:
          description: OK

  /cron:
    post:
      tags: [Cron]
      summary: Execute scheduled tasks
      security: [{ CronSecret: [] }]
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [daily-checkin-reminder, weekly-digest, wearable-sync, measure-engine, streak-check]
      responses:
        200:
          description: Tasks executed
