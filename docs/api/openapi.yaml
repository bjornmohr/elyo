    post:
      tags: [Company]
      summary: Create/Activate a measure
      description: Company-wide measures remain available when the team layer is disabled. teamId payloads return TEAM_LAYER_DISABLED; manager-only users without the team layer receive PORTAL_FORBIDDEN at the company portal guard.
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
