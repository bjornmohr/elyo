                          existing company dashboard UI. They never carry values while reporting is pending.
                        required: [isAboveThreshold, responseCount]
                        properties:
                          isAboveThreshold: { type: boolean, nullable: true, enum: [null] }
                          responseCount: { type: integer, nullable: true, enum: [null] }
                  trend:
                    $ref: '#/components/schemas/ReportingPendingBlock'
