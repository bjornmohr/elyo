        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercisesReorderPayload' }
      responses:
        200:
          description: Reordered template exercises, ordered by sortOrder
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Template not found, or a submitted ID does not belong to the template
        422:
          description: Validation error (partial payload missing template exercise IDs, or duplicate sortOrder values); no positions are changed

  /measures:
    get:
      tags: [Measures]
      summary: List health measures
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of measures
          content:
            application/json:
              schema:
                type: object
                properties:
                  measures:
                    type: array
                    items: { $ref: '#/components/schemas/Measure' }
    post:
      tags: [Measures]
      summary: Create/Activate a measure
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, description]
              properties:
                title: { type: string, minLength: 3, maxLength: 100 }
                category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
                description: { type: string, minLength: 10, maxLength: 500 }
                teamId: { type: string, nullable: true }
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { $ref: '#/components/schemas/Measure' }

  /measures/{id}:
    patch:
      tags: [Measures]
      summary: Update measure status
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, COMPLETED, DISMISSED] }
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { $ref: '#/components/schemas/Measure' }

  /points/me:
    get:
      tags: [Points]
      summary: Get my points and level
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Points data

  /webhooks/terra:
    post:
      tags: [Webhooks]
      summary: Terra webhook receiver
      responses:
        200:
          description: OK

  /cron:
    post:
      tags: [Cron]
      summary: Execute scheduled tasks
      security: [{ CronSecret: [] }]
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [daily-checkin-reminder, weekly-digest, wearable-sync, measure-engine, streak-check]
      responses:
        200:
          description: Tasks executed
