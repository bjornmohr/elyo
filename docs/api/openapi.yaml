  /company/surveys/{id}/results:
    get:
      tags: [Company]
      summary: Get aggregated survey results
      description: Team-scoped survey results are rejected with TEAM_LAYER_DISABLED when the company team layer is disabled. Company-wide survey results remain available.
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Aggregated results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      survey: { type: object }
                      scope:
                        type: object
                        nullable: true
                        properties:
                          type: { type: string, enum: [company, teams] }
                          teamIds:
                            type: array
                            nullable: true
                            items: { type: integer }
                      participation:
                        type: object
                        nullable: true
                        properties:
                          eligibleCount: { type: integer }
                          responseCount: { type: integer }
                          rate: { type: number }
                      responseCount: { type: integer }
                      minRequired:
                        type: integer
                        nullable: true
                      isAboveThreshold: { type: boolean }
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId: { type: integer }
                            text: { type: string }
                            type: { type: string, enum: [SCALE, MULTIPLE_CHOICE, TEXT, YES_NO] }
                            answerCount:
                              type: integer
                              nullable: true
                              description: Null when the question-level anonymity threshold is not met or when a SCALE, YES_NO, or MULTIPLE_CHOICE distribution is suppressed because any non-zero bucket is below the anonymity threshold.
                            avgValue:
                              type: number
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            minValue:
                              type: integer
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            maxValue:
                              type: integer
                              nullable: true
                              description: Null when SCALE buckets are suppressed.
                            scaleMinLabel:
                              type: string
                              nullable: true
                            scaleMaxLabel:
                              type: string
                              nullable: true
                            isSuppressed:
                              type: boolean
                              description: True when the question result or one or more non-zero answer buckets are hidden.
                            suppressedCount:
                              type: integer
                              nullable: true
                              description: Total answers hidden inside visible-safe suppressed buckets. Null when suppressed metadata could allow inference.
                            suppressionReason:
                              type: string
                              nullable: true
                              enum: [QUESTION_THRESHOLD_NOT_MET, DISTRIBUTION_SUPPRESSED]
                              description: Optional reason returned when a question or distribution is suppressed.
                            distribution:
                              type: array
                              description: SCALE distribution buckets. Empty when any non-zero bucket is below the anonymity threshold; answerCount is also null in that case.
                              items:
                                type: object
                                properties:
                                  value: { type: integer }
                                  count: { type: integer }
                                  percentage: { type: number }
                            trueCount:
                              type: integer
                              nullable: true
                              description: Null when the YES_NO split is suppressed because either non-zero bucket is below the anonymity threshold; answerCount is also null in that case.
                            falseCount:
                              type: integer
                              nullable: true
                              description: Null when the YES_NO split is suppressed because either non-zero bucket is below the anonymity threshold; answerCount is also null in that case.
                            truePercentage:
                              type: number
                              nullable: true
                            falsePercentage:
                              type: number
                              nullable: true
                            options:
                              type: array
                              description: MULTIPLE_CHOICE options. Empty when the distribution is suppressed because any non-zero option bucket is below the anonymity threshold; answerCount is also null in that case.
                              items:
                                type: object
                                properties:
                                  value: { type: string, nullable: true }
                                  count: { type: integer }
                                  percentage: { type: number }
        403:
          description: User is not eligible for the company portal, anonymity threshold not met, or TEAM_LAYER_DISABLED for team-scoped results when the company team layer is disabled
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PortalForbiddenError'
                  - $ref: '#/components/schemas/MessageForbiddenError'
                  - $ref: '#/components/schemas/AnonymityThresholdError'
                  - $ref: '#/components/schemas/TeamLayerDisabledError'

