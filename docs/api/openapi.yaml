      responses:
        200:
          description: Updated system measure template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSystemMeasureTemplateDetail' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Not found
        422:
          description: Validation error (invalid enum or numeric range)

  /admin/system-measure-templates/{systemMeasureTemplate}/archive:
    post:
      tags: [Admin]
      summary: Archive system measure template
      description: Sets status to ARCHIVED. Idempotent. Template exercises stay attached; system exercises and user snapshots are untouched.
      security: [{ Sanctum: [] }]
      parameters:
        - name: systemMeasureTemplate
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Archived system measure template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSystemMeasureTemplateDetail' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Not found

  /admin/system-measure-templates/{systemMeasureTemplate}/exercises:
    post:
      tags: [Admin]
      summary: Add exercise to system measure template
      description: Attaches an existing, non-archived system exercise to the template. Appends at the end when sortOrder is omitted. Archived exercises and duplicates are rejected with 422.
      security: [{ Sanctum: [] }]
      parameters:
        - name: systemMeasureTemplate
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExerciseCreatePayload' }
      responses:
        201:
          description: Created template exercise
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Template not found
        422:
          description: Validation error (unknown or archived exercise, duplicate exercise, taken sortOrder, invalid numeric range)

  /admin/system-measure-templates/{systemMeasureTemplate}/exercises/{templateExercise}:
    patch:
      tags: [Admin]
      summary: Update template exercise overrides
      description: Updates template-specific overrides only. The underlying system exercise is never modified. Returns 404 when the template exercise does not belong to the template.
      security: [{ Sanctum: [] }]
      parameters:
        - name: systemMeasureTemplate
          in: path
          required: true
          schema: { type: integer }
        - name: templateExercise
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExerciseUpdatePayload' }
      responses:
        200:
          description: Updated template exercise
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Template or template exercise not found (including a template exercise of another template)
        422:
          description: Validation error (invalid numeric range or taken sortOrder)
    delete:
      tags: [Admin]
      summary: Remove exercise from system measure template
      description: Deletes only the template-exercise relationship. The underlying system exercise and the template itself are kept. Returns 404 when the template exercise does not belong to the template.
      security: [{ Sanctum: [] }]
      parameters:
        - name: systemMeasureTemplate
          in: path
          required: true
          schema: { type: integer }
        - name: templateExercise
          in: path
          required: true
          schema: { type: integer }
      responses:
        204:
          description: Template exercise removed
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Template or template exercise not found (including a template exercise of another template)

  /admin/system-measure-templates/{systemMeasureTemplate}/exercises/reorder:
    post:
      tags: [Admin]
      summary: Reorder template exercises
      description: Transactionally rewrites the sort order. The payload must contain the complete set of the template's exercise IDs — partial payloads and duplicate sortOrder values are rejected with 422 before anything is written; IDs not belonging to the template are rejected with 404. Returns the full ordered exercise list.
      security: [{ Sanctum: [] }]
      parameters:
        - name: systemMeasureTemplate
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercisesReorderPayload' }
      responses:
        200:
          description: Reordered template exercises, ordered by sortOrder
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }
        401:
          description: Unauthenticated
        403:
          description: Forbidden (not a platform admin role)
        404:
          description: Template not found, or a submitted ID does not belong to the template
        422:
          description: Validation error (partial payload missing template exercise IDs, or duplicate sortOrder values); no positions are changed

