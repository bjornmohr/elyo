openapi: 3.0.3
info:
  title: ELYO API
  description: API for the ELYO health platform (Migrated from Next.js to Laravel)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Employee
    description: Endpoints for employees (check-ins, dashboard)
  - name: Company
    description: Endpoints for company admins and managers
  - name: Partner
    description: Endpoints for external partners
  - name: Admin
    description: ELYO platform administration
  - name: Measures
    description: Company health measures
  - name: Points
    description: Gamification and points system
  - name: Reports
    description: Data and PDF reports
  - name: Wearables
    description: Wearable device integrations
  - name: Webhooks
    description: External service webhooks
  - name: Cron
    description: Scheduled tasks

components:
  securitySchemes:
    Sanctum:
      type: http
      scheme: bearer
    PartnerSession:
      type: apiKey
      in: cookie
      name: elyo_partner_session
    CronSecret:
      type: apiKey
      in: header
      name: x-cron-secret

  responses:
    TeamLayerDisabled:
      description: Team layer is disabled for this company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamLayerDisabledError'

    PortalForbidden:
      description: User is not eligible for the requested portal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalForbiddenError'

    CompanyPortalForbiddenOrTeamLayerDisabled:
      description: User is not eligible for the company portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

    PortalOrScopeForbidden:
      description: User is not eligible for the requested portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE, ELYO_ADMIN] }
        isActive: { type: boolean }

    AdminCompany:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold: { type: integer }
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.
        users_count: { type: integer, nullable: true }
        created_by_elyo_admin_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminCompanyCreatePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, nullable: true }
        anonymity_threshold: { type: integer, minimum: 1 }
        team_layer_enabled:
          type: boolean
          description: Defaults to false on create when omitted.

    AdminCompanyUpdatePayload:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          maxLength: 255
          description: Optional on update, but must be a non-null string when provided.
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold: { type: integer, minimum: 1 }
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.

    WellbeingEntry:
      type: object
      properties:
        id: { type: string }
        mood: { type: integer }
        stress: { type: integer }
        energy: { type: integer }
        score: { type: number }
        note: { type: string, nullable: true }
        periodKey: { type: string }
        createdAt: { type: string, format: date-time }
    EmployeeCheckinStatusResponse:
      type: object
      required: [completed, entry]
      properties:
        completed:
          type: boolean
        entry:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WellbeingEntry'

    CheckinAlreadyDoneError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [CHECKIN_ALREADY_DONE]
              example: CHECKIN_ALREADY_DONE
            message:
              type: string
              example: Der Check-in wurde heute bereits abgeschlossen.


    Measure:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        suggestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    TeamLayerDisabledError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [TEAM_LAYER_DISABLED] }
            message: { type: string }

    PortalForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [PORTAL_FORBIDDEN] }
            message: { type: string }

    CodedForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [FORBIDDEN] }
            message: { type: string }

    MessageForbiddenError:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string }

    AnonymityThresholdError:
      type: object
      required: [error, minRequired, isAboveThreshold, suppressionReason]
      additionalProperties: false
      properties:
        error: { type: string }
        minRequired: { type: integer }
        isAboveThreshold: { type: boolean }
        suppressionReason:
          type: string
          enum: [ANONYMITY_THRESHOLD_NOT_MET]

    Partner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        type: { type: string }
        verificationStatus: { type: string, enum: [PENDING_DOCS, PENDING_REVIEW, VERIFIED, SUSPENDED, REJECTED] }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                requested_portal: { type: string, enum: [admin, company, employee, partner], nullable: true }
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer, nullable: true }
                      companyName: { type: string, nullable: true }
                      teamId: { type: integer, nullable: true }
                      teamName: { type: string, nullable: true }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                  activePortal: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }
        403:
          description: Requested portal is forbidden
        422:
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email }
                  name: { type: string }
                  roles:
                    type: array
                    items: { type: string }
                  companyId: { type: integer, nullable: true }
                  companyName: { type: string, nullable: true }
                  teamLayerEnabled:
                    type: boolean
                    description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                  teamId: { type: integer, nullable: true }
                  teamName: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new company and admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 2 }
      responses:
        200:
          description: Success
        400:
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/invite/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation
      description: Accepts the persisted invitation only. Request company or team identifiers are ignored; team assignment comes from the invite token and must belong to the invite company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password, password_confirmation]
              properties:
                token: { type: string }
                name: { type: string, maxLength: 255 }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        200:
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                      teamId: { type: integer, nullable: true }
        422:
          description: Invalid invite, company conflict, team conflict, or invalid persisted invite team
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [INVALID_INVITE, COMPANY_CONFLICT, TEAM_CONFLICT, INVALID_INVITE_TEAM]
                      message: { type: string }

  /employee/dashboard:
    get:
      tags: [Employee]
      summary: Get employee dashboard data
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest: { $ref: '#/components/schemas/WellbeingEntry', nullable: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }
                  streakCount: { type: integer }
                  points: { type: integer }
                  todayCheckinCompleted: { type: boolean }
        401:
          description: Unauthorized

  /employee/checkin:
    post:
      tags: [Employee]
      summary: Submit a wellbeing check-in
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mood: { type: integer, minimum: 1, maximum: 10 }
                stress: { type: integer, minimum: 1, maximum: 10 }
                energy: { type: integer, minimum: 1, maximum: 10 }
                note: { type: string, nullable: true }
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  score: { type: number }
                  periodKey: { type: string }
        409:
          description: Check-in already completed for the authenticated employee and current daily period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinAlreadyDoneError'
              example:
                error:
                  code: CHECKIN_ALREADY_DONE
                  message: Der Check-in wurde heute bereits abgeschlossen.

  /employee/checkin/status:
    get:
      tags: [Employee]
      summary: Get daily check-in status
      description: Returns whether the authenticated employee has already completed the check-in for the current daily period.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Daily check-in status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCheckinStatusResponse'
              examples:
                completed:
                  summary: Check-in already completed
                  value:
                    completed: true
                    entry:
                      id: "01JY0000000000000000000001"
                      mood: 8
                      stress: 3
                      energy: 7
                      score: 7.7
                      note: "Guter Start in den Tag."
                      periodKey: "2026-05-25"
                      createdAt: "2026-05-25T08:00:00Z"
                notCompleted:
                  summary: No check-in for the current daily period
                  value:
                    completed: false
                    entry: null
        401:
          description: Unauthorized

  /employee/history:
    get:
      tags: [Employee]
      summary: Get wellbeing history
      security: [{ Sanctum: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }

  /employee/profile:
    get:
      tags: [Employee]
      summary: Get employee profile
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    put:
      tags: [Employee]
      summary: Update employee profile
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        200:
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /employee/surveys:
    get:
      tags: [Employee]
      summary: List available surveys
      description: When the company team layer is disabled, only company-wide surveys are returned; team-targeted surveys are filtered out.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of surveys
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string, nullable: true }
                        questionCount: { type: integer }
                        completed: { type: boolean }
                        endsAt: { type: string, format: date-time, nullable: true }

  /employee/surveys/{surveyId}:
    get:
      tags: [Employee]
      summary: Get survey details
      description: Team-targeted surveys are not available to employees when the company team layer is disabled and return 404.
      security: [{ Sanctum: [] }]
      parameters:
        - name: surveyId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Survey details with questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  survey:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      description: { type: string, nullable: true }
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            text: { type: string }
                            type: { type: string }
                            order: { type: integer }
                            isRequired: { type: boolean }
                            options: { type: object, nullable: true }
                            scaleMinLabel: { type: string, nullable: true }
                            scaleMaxLabel: { type: string, nullable: true }
        404:
          description: Not found or not active
        409:
          description: Already completed

  /employee/surveys/{surveyId}/respond:
    post:
      tags: [Employee]
      summary: Submit survey responses
      description: Team-targeted surveys are not answerable by employees when the company team layer is disabled and return 404.
      security: [{ Sanctum: [] }]
      parameters:
        - name: surveyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId: { type: string }
                      scaleValue: { type: integer, nullable: true }
                      textValue: { type: string, nullable: true }
                      choiceValue: { type: string, nullable: true }
                      boolValue: { type: boolean, nullable: true }
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        404:
          description: Survey not found, not active, or unavailable because the company team layer is disabled

  /partner/login:
    post:
      tags: [Partner]
      summary: Partner login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              schema: { type: string, example: 'elyo_partner_session=...; Path=/; HttpOnly' }
        401:
          description: Invalid credentials

  /partner/me:
    get:
      tags: [Partner]
      summary: Get current partner profile
      security: [{ PartnerSession: [] }]
      responses:
        200:
          description: Partner profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }

  /company/dashboard:
    get:
      tags: [Company]
      summary: Get company dashboard data
      description: Company-level dashboard remains available to company admins and owners when the team layer is disabled. Team-level aggregates are omitted in that state. Manager-only users are not company-portal eligible while the team layer is disabled and receive PORTAL_FORBIDDEN.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Company metrics and trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: object
                    properties:
                      avgMood: { type: number, nullable: true }
                      avgStress: { type: number, nullable: true }
                      avgEnergy: { type: number, nullable: true }
                      avgScore: { type: number, nullable: true }
                      responseCount: { type: integer, nullable: true }
                      respondentCount: { type: integer, nullable: true }
                      eligibleEmployeeCount: { type: integer, nullable: true }
                      participationRate: { type: integer, nullable: true }
                      isAboveThreshold: { type: boolean }
                      suppressionReason:
                        type: string
                        nullable: true
                        enum: [ANONYMITY_THRESHOLD_NOT_MET]
                  trend:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string }
                        avgScore: { type: number }
                        avgMood: { type: number }
                        avgStress: { type: number }
                        avgEnergy: { type: number }
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        color: { type: string, nullable: true }
                        managerId: { type: integer, nullable: true }
                        metrics:
                          type: object
                          properties:
                            isAboveThreshold: { type: boolean }
                            responseCount: { type: integer, nullable: true }
                            respondentCount: { type: integer, nullable: true }
                            eligibleEmployeeCount: { type: integer, nullable: true }
                            participationRate: { type: integer, nullable: true }
                            avgScore: { type: number, nullable: true }
                            avgMood: { type: number, nullable: true }
                            avgStress: { type: number, nullable: true }
                            avgEnergy: { type: number, nullable: true }
                            suppressionReason:
                              type: string
                              nullable: true
                              enum: [ANONYMITY_THRESHOLD_NOT_MET]
        403:
          $ref: '#/components/responses/PortalForbidden'

  /company/invitations:
    get:
      tags: [Company]
      summary: List company invitations
      description: Company managers only see employee invitations they created.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string, format: email }
                        role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE] }
                        teamId:
                          type: integer
                          nullable: true
                          description: Optional same-company team affiliation for the invited user.
                        status: { type: string }
                        expiresAt: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
        403:
          $ref: '#/components/responses/PortalForbidden'
    post:
      tags: [Company]
      summary: Create a company invitation
      description: teamId is an optional same-company team affiliation for the invited user. When the company team layer is disabled, teamId must be omitted/null and COMPANY_MANAGER invitations are rejected. When enabled, admins may set teamId for supported company-internal roles, and managers may only invite employees into teams they manage.
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE] }
                teamId:
                  type: integer
                  nullable: true
                  description: Optional same-company team affiliation for the invited user.
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE] }
                      teamId:
                        type: integer
                        nullable: true
                        description: Optional same-company team affiliation for the invited user.
                      status: { type: string }
                      expires_at: { type: string, format: date-time }
                      invite_token: { type: string }
        403:
          description: Forbidden for manager role invites, unmanaged team access, disabled team-layer manager workflows, or users without company portal access
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PortalForbiddenError'
                  - $ref: '#/components/schemas/TeamLayerDisabledError'
                  - $ref: '#/components/schemas/CodedForbiddenError'
        422:
          description: Validation error for invalid teamId, disabled team-layer teamId payloads, or company email conflict

  /company/invitations/{id}:
    delete:
      tags: [Company]
      summary: Revoke a pending company invitation
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        403:
          description: Forbidden for invitations outside the caller scope, or users without company portal access
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PortalForbiddenError'
                  - $ref: '#/components/schemas/CodedForbiddenError'
        422:
          description: Invitation is no longer pending

  /company/teams:
    get:
      tags: [Company]
      summary: List company teams
