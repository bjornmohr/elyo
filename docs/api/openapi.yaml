openapi: 3.0.3
info:
  title: ELYO API
  description: API for the ELYO health platform (Migrated from Next.js to Laravel)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Employee
    description: Endpoints for employees (check-ins, dashboard)
  - name: Company
    description: Endpoints for company admins and managers
  - name: Partner
    description: Endpoints for external partners
  - name: Admin
    description: ELYO platform administration
  - name: Measures
    description: Company health measures
  - name: Points
    description: Gamification and points system
  - name: Reports
    description: Data and PDF reports
  - name: Wearables
    description: Wearable device integrations
  - name: Webhooks
    description: External service webhooks
  - name: Cron
    description: Scheduled tasks

components:
  securitySchemes:
    Sanctum:
      type: http
      scheme: bearer
    PartnerSession:
      type: apiKey
      in: cookie
      name: elyo_partner_session
    CronSecret:
      type: apiKey
      in: header
      name: x-cron-secret

  responses:
    TeamLayerDisabled:
      description: Team layer is disabled for this company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamLayerDisabledError'

    PortalForbidden:
      description: User is not eligible for the requested portal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalForbiddenError'

    CompanyPortalForbiddenOrTeamLayerDisabled:
      description: User is not eligible for the company portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

    PortalOrScopeForbidden:
      description: User is not eligible for the requested portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE, ELYO_ADMIN] }
        isActive: { type: boolean }

    AdminCompany:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold: { type: integer }
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.
        users_count: { type: integer, nullable: true }
        created_by_elyo_admin_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminCompanyCreatePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, nullable: true }
        anonymity_threshold: { type: integer, minimum: 1 }
        team_layer_enabled:
          type: boolean
          description: Defaults to false on create when omitted.

    AdminCompanyUpdatePayload:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          maxLength: 255
          description: Optional on update, but must be a non-null string when provided.
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold: { type: integer, minimum: 1 }
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.

    SystemExerciseType:
      type: string
      enum: [MOBILITY, STRENGTH, BREATHING, MINDFULNESS, EDUCATION, REFLECTION]

    SystemExerciseDifficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    SystemExerciseStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    SystemExerciseTagCategory:
      type: string
      enum: [BODY_REGION, GOAL, SETTING, EQUIPMENT, CONTRAINDICATION, PERSONA_HINT, HEALTH_FOCUS]

    AdminSystemExerciseTag:
      type: object
      properties:
        id: { type: integer }
        category: { $ref: '#/components/schemas/SystemExerciseTagCategory' }
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        isActive: { type: boolean }

    AdminSystemExercise:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          description: Generated server-side from the title on create; never changed on update.
        title: { type: string }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        defaultDurationMinutes: { type: integer, nullable: true }
        defaultSets: { type: integer, nullable: true }
        defaultRepetitions: { type: integer, nullable: true }
        defaultHoldSeconds: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback: { type: boolean }
        status: { $ref: '#/components/schemas/SystemExerciseStatus' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemExerciseTag' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminSystemExerciseCreatePayload:
      type: object
      required: [title, exerciseType, difficulty]
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status:
          allOf:
            - $ref: '#/components/schemas/SystemExerciseStatus'
          description: Defaults to ACTIVE when omitted.
        defaultDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback:
          type: boolean
          description: Defaults to true when omitted.
        tagIds:
          type: array
          description: IDs of existing system exercise tags; the assignment is synced exactly to this list.
          items: { type: integer }

    AdminSystemExerciseUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The slug is never regenerated.
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status: { $ref: '#/components/schemas/SystemExerciseStatus' }
        defaultDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback: { type: boolean }
        tagIds:
          type: array
          description: When present, tag assignment is synced exactly to this list; when absent, tags are untouched.
          items: { type: integer }

    AdminSystemExerciseListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemExercise' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    SystemMeasureTemplateStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    SystemMeasureTemplateCategory:
      type: string
      enum: [MOBILITY, STRENGTH, BREATHING, MINDFULNESS, EDUCATION, REFLECTION, MIXED]

    AdminSystemMeasureTemplate:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          description: Generated server-side from the title on create; never changed on update.
        title: { type: string }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/SystemMeasureTemplateCategory' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        estimatedDurationMinutes: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/SystemMeasureTemplateStatus' }
        isFeatured: { type: boolean }
        exerciseCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminSystemMeasureTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/AdminSystemMeasureTemplate'
        - type: object
          properties:
            exercises:
              type: array
              description: Template exercises ordered by sortOrder ascending.
              items: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }

    AdminSystemMeasureTemplateExercise:
      type: object
      properties:
        id: { type: integer }
        systemExerciseId: { type: integer }
        sortOrder: { type: integer }
        customTitle: { type: string, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, nullable: true }
        customSets: { type: integer, nullable: true }
        customRepetitions: { type: integer, nullable: true }
        customHoldSeconds: { type: integer, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired: { type: boolean }
        exercise:
          type: object
          description: Read-only summary of the underlying system exercise.
          properties:
            id: { type: integer }
            slug: { type: string }
            title: { type: string }
            shortDescription: { type: string, nullable: true }
            exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
            difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
            defaultDurationMinutes: { type: integer, nullable: true }
            status: { $ref: '#/components/schemas/SystemExerciseStatus' }
            tags:
              type: array
              items: { $ref: '#/components/schemas/AdminSystemExerciseTag' }

    AdminSystemMeasureTemplateCreatePayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category:
          allOf:
            - $ref: '#/components/schemas/SystemMeasureTemplateCategory'
          description: Defaults to MIXED when omitted.
        difficulty:
          allOf:
            - $ref: '#/components/schemas/SystemExerciseDifficulty'
          description: Defaults to BEGINNER when omitted.
        status:
          allOf:
            - $ref: '#/components/schemas/SystemMeasureTemplateStatus'
          description: Defaults to ACTIVE when omitted.
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        isFeatured:
          type: boolean
          description: Defaults to false when omitted.

    AdminSystemMeasureTemplateUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The slug is never regenerated.
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/SystemMeasureTemplateCategory' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status: { $ref: '#/components/schemas/SystemMeasureTemplateStatus' }
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        isFeatured: { type: boolean }

    AdminSystemMeasureTemplateExerciseCreatePayload:
      type: object
      required: [systemExerciseId]
      properties:
        systemExerciseId:
          type: integer
          description: Must reference an existing, non-archived system exercise that is not already part of the template.
        sortOrder:
          type: integer
          minimum: 1
          description: Appended at the end when omitted. An explicitly provided sortOrder that is already taken in the template is rejected with 422; use the reorder endpoint to move multiple exercises.
        customTitle: { type: string, maxLength: 255, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired:
          type: boolean
          description: Defaults to true when omitted.

    AdminSystemMeasureTemplateExerciseUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The underlying system exercise is never modified.
      properties:
        sortOrder:
          type: integer
          minimum: 1
          description: An explicitly provided sortOrder that is already taken in the template is rejected with 422; use the reorder endpoint to move multiple exercises.
        customTitle: { type: string, maxLength: 255, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired: { type: boolean }

    AdminSystemMeasureTemplateExercisesReorderPayload:
      type: object
      required: [items]
      description: Must contain the complete set of the template's exercise IDs. Partial payloads (missing IDs) and duplicate sortOrder values are rejected with 422 and no positions are changed. IDs not belonging to the template are rejected with 404.
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, sortOrder]
            properties:
              id:
                type: integer
                description: Template exercise ID belonging to the template.
              sortOrder: { type: integer, minimum: 1 }

    AdminSystemMeasureTemplateListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemMeasureTemplate' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    WellbeingEntry:
      type: object
      properties:
        id: { type: string }
        mood: { type: integer }
        stress: { type: integer }
        energy: { type: integer }
        score: { type: number }
        note: { type: string, nullable: true }
        periodKey: { type: string }
        createdAt: { type: string, format: date-time }
    EmployeeCheckinStatusResponse:
      type: object
      required: [completed, entry]
      properties:
        completed:
          type: boolean
        entry:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WellbeingEntry'

    CheckinAlreadyDoneError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [CHECKIN_ALREADY_DONE]
              example: CHECKIN_ALREADY_DONE
            message:
              type: string
              example: Der Check-in wurde heute bereits abgeschlossen.


    Measure:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        derivedStatus:
          type: string
          enum: [UPCOMING, RUNNING, COMPLETED, PLANNED]
          readOnly: true
          description: Server-derived execution status for list/card display. SUGGESTED and DISMISSED map to PLANNED; ACTIVE with a past endsAt maps to COMPLETED.
        suggestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        measureOrigin:
          type: string
          enum: [COMPANY_CREATED, ELYO_TEMPLATE]
          default: COMPANY_CREATED
          readOnly: true
        deliveryType:
          type: string
          enum: [REMOTE, ONSITE, HYBRID]
          default: ONSITE
        executionType:
          type: string
          enum: [INFORMATION_ONLY, GUIDED_SESSION, SELF_REPORTED_ACTION, EVENT_PARTICIPATION, CHALLENGE]
          default: EVENT_PARTICIPATION
        verificationRequirement:
          type: string
          enum: [SELF_REPORT, QR_CODE]
          default: SELF_REPORT
        visibilityScope:
          type: string
          enum: [COMPANY, TEAM]
          description: Derived server-side from team scope.
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        durationMinutes: { type: integer, nullable: true, minimum: 1 }
        instructions: { type: string, nullable: true, maxLength: 2000 }
        locationName: { type: string, nullable: true, maxLength: 255 }
        locationAddress: { type: string, nullable: true, maxLength: 1000 }
        capacity: { type: integer, nullable: true, minimum: 1 }
        pointsOverride:
          type: integer
          nullable: true
          minimum: 0
          description: Stored for future behavior; current participation points continue to use point settings.

    CompanyMeasurePayload:
      type: object
      properties:
        deliveryType: { type: string, enum: [REMOTE, ONSITE, HYBRID] }
        executionType: { type: string, enum: [INFORMATION_ONLY, GUIDED_SESSION, SELF_REPORTED_ACTION, EVENT_PARTICIPATION, CHALLENGE] }
        verificationRequirement: { type: string, enum: [SELF_REPORT, QR_CODE] }
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 date-time. Clients should send an explicit timezone offset or UTC designator (e.g. 2026-06-20T09:00:00Z); the web UI displays local wall time but always serializes to an explicit UTC instant. Timezone-less values are accepted for backward compatibility and interpreted as UTC.
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 date-time; same timezone semantics as startsAt. Must be strictly after the effective startsAt value when both are present.
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: For scheduled execution types EVENT_PARTICIPATION and GUIDED_SESSION the stored value mirrors the schedule window whenever both effective startsAt and endsAt are present - derived on create or update, overriding any submitted value. When the effective schedule window is incomplete, an explicitly submitted durationMinutes is stored as manual duration (null clears it); a previously derived value is cleared only when a startsAt/endsAt update leaves the window incomplete without submitting durationMinutes. Updates that do not touch startsAt, endsAt, durationMinutes, or executionType leave the stored value unchanged.
        instructions: { type: string, nullable: true, maxLength: 2000 }
        locationName: { type: string, nullable: true, maxLength: 255 }
        locationAddress: { type: string, nullable: true, maxLength: 1000 }
        capacity: { type: integer, nullable: true, minimum: 1 }
        pointsOverride: { type: integer, nullable: true, minimum: 0 }

    CompanyMeasureCreatePayload:
      allOf:
        - $ref: '#/components/schemas/CompanyMeasurePayload'
        - type: object
          required: [title, category, description]
          properties:
            title: { type: string, minLength: 3, maxLength: 100 }
            category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
            description: { type: string, minLength: 10, maxLength: 500 }
            teamId: { type: integer, nullable: true }
            status: { type: string, enum: [SUGGESTED, ACTIVE] }

    CompanyMeasureUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/CompanyMeasurePayload'
        - type: object
          properties:
            title: { type: string, minLength: 3, maxLength: 100 }
            category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
            description: { type: string, minLength: 10, maxLength: 500 }
            status: { type: string, enum: [ACTIVE, COMPLETED, DISMISSED] }

    MeasureParticipationSummary:
      type: object
      required:
        - measureId
        - isAboveThreshold
        - eligibleCount
        - participantCount
        - participationRate
        - suppressionReason
        - teamBreakdown
      additionalProperties: false
      properties:
        measureId: { type: integer }
        isAboveThreshold: { type: boolean }
        eligibleCount:
          type: integer
          nullable: true
          description: Null when anonymity threshold suppression applies.
        participantCount:
          type: integer
          nullable: true
          description: Null when anonymity threshold suppression applies.
        participationRate:
          type: number
          nullable: true
          description: Percentage of scoped eligible employees who participated, null when suppressed.
        suppressionReason:
          type: string
          nullable: true
          enum: [ANONYMITY_THRESHOLD_NOT_MET]
        teamBreakdown:
          type: array
          nullable: true
          description: Nullable future field. Current backend responses return null; non-null array data is reserved for a future privacy-reviewed team breakdown feature.
          items:
            type: object
            additionalProperties: false
            properties:
              teamId: { type: integer }
              teamName: { type: string }
              isAboveThreshold: { type: boolean }
              eligibleCount: { type: integer, nullable: true }
              participantCount: { type: integer, nullable: true }
              participationRate: { type: number, nullable: true }
              suppressionReason: { type: string, nullable: true }
            description: Always null for this measure-level aggregate endpoint.

    MeasureExecution:
      type: object
      description: Execution details for a measure, fully derived from existing data. Independent of the demo/prod data mode.
      required: [measureId, derivedStatus, deliveryType, executionType, startsAt, endsAt, locationName, capacity, registeredCount, checkin, isAboveThreshold]
      additionalProperties: false
      properties:
        measureId: { type: integer }
        derivedStatus:
          type: string
          enum: [UPCOMING, RUNNING, COMPLETED, PLANNED]
          description: Derived from status plus startsAt/endsAt. SUGGESTED and DISMISSED map to PLANNED; ACTIVE with a past endsAt maps to COMPLETED.
        deliveryType:
          type: string
          enum: [REMOTE, ONSITE, HYBRID]
        executionType:
          type: string
          enum: [INFORMATION_ONLY, GUIDED_SESSION, SELF_REPORTED_ACTION, EVENT_PARTICIPATION, CHALLENGE]
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        locationName: { type: string, nullable: true }
        capacity: { type: integer, nullable: true }
        registeredCount:
          type: integer
          nullable: true
          description: Distinct participants. Null when anonymity threshold suppression applies.
        checkin:
          type: object
          required: [active, createdAt, required]
          additionalProperties: false
          properties:
            active:
              type: boolean
              description: True while an unrevoked, unexpired check-in token exists.
            createdAt: { type: string, format: date-time, nullable: true }
            required:
              type: boolean
              description: True when verificationRequirement is QR_CODE.
        isAboveThreshold: { type: boolean }

    MeasureFieldStatistics:
      type: object
      description: Aggregated measure statistics for one risk field. In prod mode measureCount and avgParticipationRate are computed from the database; avgImpactRating and fieldTrend30d stay null until their data sources exist. In demo mode all values come from the deterministic demo dataset.
      required: [field, fieldLabel, measureCount, avgParticipationRate, isAboveThreshold, avgImpactRating, impactIsPreliminary, fieldTrend30d]
      additionalProperties: false
      properties:
        field:
          type: string
          enum: [SLEEP, BACK, STRESS_MENTAL, MOVEMENT, NUTRITION, KNOWLEDGE]
        fieldLabel: { type: string }
        measureCount:
          type: integer
          description: Non-dismissed measures whose category maps to this field (flexibility→BACK, mental→STRESS_MENTAL, sport→MOVEMENT, nutrition→NUTRITION, workshop→KNOWLEDGE). SLEEP has no measure category yet.
        avgParticipationRate:
          type: number
          nullable: true
          description: Average participation rate across the field's measures. Null when the field has no measures or every summary is suppressed by the anonymity threshold.
        isAboveThreshold:
          type: boolean
          description: False only when the field has measures but all of them are below the anonymity threshold.
        avgImpactRating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          description: Null until the impact layer has a real data source (always null in prod mode).
        impactIsPreliminary: { type: boolean }
        fieldTrend30d:
          type: number
          nullable: true
          description: Field score trend in percent points. Null until the extended check-in ships (always null in prod mode).

    MeasureImpactGroup:
      type: object
      required: [n, scoreBefore, scoreAfter]
      additionalProperties: false
      properties:
        n: { type: integer }
        scoreBefore: { type: integer }
        scoreAfter: { type: integer }

    MeasureImpact:
      type: object
      description: Concept module. Wirkungsanalyse comparing participants against non-participants over a fixed window. Currently served from demo data for COMPLETED measures in demo mode only; prod mode returns data null.
      required: [measureId, field, windowWeeks, participants, control, netEffect, rating, isAboveThreshold]
      additionalProperties: false
      properties:
        measureId: { type: integer }
        field: { type: string }
        windowWeeks: { type: integer }
        participants: { $ref: '#/components/schemas/MeasureImpactGroup' }
        control: { $ref: '#/components/schemas/MeasureImpactGroup' }
        netEffect:
          type: integer
          description: (participants.scoreAfter - participants.scoreBefore) - (control.scoreAfter - control.scoreBefore).
        rating: { type: integer, minimum: 0, maximum: 5 }
        isAboveThreshold:
          type: boolean
          description: Both groups must satisfy the anonymity threshold.

    RiskFieldMonthlyScore:
      type: object
      required: [period, score]
      additionalProperties: false
      properties:
        period: { type: string, description: "Month key, e.g. 2026-06." }
        score: { type: integer, minimum: 0, maximum: 100 }

    RiskField:
      type: object
      required: [field, fieldLabel, relevanceLevel, score, trend30d, monthlyScores, monthsAboveHighSince, linkedMeasures]
      additionalProperties: false
      properties:
        field: { type: string }
        fieldLabel: { type: string }
        relevanceLevel: { type: integer, minimum: 1, maximum: 5 }
        score: { type: integer, minimum: 0, maximum: 100 }
        trend30d: { type: number, description: 30-day trend in percent points. }
        monthlyScores:
          type: array
          description: Six months, oldest first; the last entry equals score.
          items: { $ref: '#/components/schemas/RiskFieldMonthlyScore' }
        monthsAboveHighSince:
          type: integer
          nullable: true
          description: Consecutive months the field has been in the high band, null when not applicable.
        linkedMeasures:
          type: object
          required: [activeCount, suggestedCount]
          additionalProperties: false
          properties:
            activeCount: { type: integer }
            suggestedCount: { type: integer }

    InsightRecommendation:
      type: object
      required: [title, text]
      additionalProperties: false
      properties:
        title: { type: string }
        text: { type: string }

    RiskLandscape:
      type: object
      description: Concept module behind riskLandscapeEnabled. Demo mode serves deterministic demo data; prod mode returns data as an empty array until the extended check-in ships.
      required: [fields, recommendations]
      additionalProperties: false
      properties:
        fields:
          type: array
          items: { $ref: '#/components/schemas/RiskField' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/InsightRecommendation' }

    UsageFunnelStage:
      type: object
      required: [key, label, count, rate]
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [registered, context_entered, recommendation_received, measure_started, active_14d]
        label: { type: string }
        count: { type: integer }
        rate: { type: number, description: Percent of the first stage. }

    UsageFunnelTransition:
      type: object
      required: [from, to, avgDays]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        avgDays: { type: number, nullable: true }

    UsageFunnelCategory:
      type: object
      description: Per-category funnel breakdown. Categories only exist from the recommendation stage onward — the registration and context stages are company-wide by definition. Rates are relative to the category's received recommendations (basis 100%).
      required: [key, label, recommendationReceived, measureStarted, active14d]
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [workshop, sport, mental, nutrition, flexibility]
        label: { type: string }
        recommendationReceived: { type: integer }
        measureStarted: { type: integer }
        active14d: { type: integer }

    UsageFunnel:
      type: object
      description: Concept module behind usageFunnelEnabled. Demo mode serves deterministic demo data (stages stay monotonically decreasing); prod mode returns data null until funnel event tracking ships.
      required: [cohort, stages, transitions, returnRate14d, avgDaysToFirstDecision, previousCohort]
      additionalProperties: false
      properties:
        cohort: { type: string, description: "Cohort month, e.g. 2026-06." }
        stages:
          type: array
          items: { $ref: '#/components/schemas/UsageFunnelStage' }
        transitions:
          type: array
          items: { $ref: '#/components/schemas/UsageFunnelTransition' }
        returnRate14d: { type: number }
        avgDaysToFirstDecision: { type: number }
        previousCohort:
          type: object
          nullable: true
          required: [cohort, stages]
          additionalProperties: false
          properties:
            cohort: { type: string }
            stages:
              type: array
              items:
                type: object
                required: [key, rate]
                additionalProperties: false
                properties:
                  key: { type: string }
                  rate: { type: number }
        categoryInsight: { type: string, nullable: true }
        categories:
          type: array
          description: Optional per-category breakdown; each category funnel stays monotone (recommendationReceived >= measureStarted >= active14d).
          items: { $ref: '#/components/schemas/UsageFunnelCategory' }

    InfectionRadar:
      type: object
      description: Concept module behind infectionRadarEnabled. Aggregate-only symptom counts, never individual data. Demo mode serves deterministic demo data with the last seven calendar days; prod mode returns data null until symptom check-in and RKI integration ship.
      required: [overallStatus, locations, symptomReports7d, rkiIncidence]
      additionalProperties: false
      properties:
        overallStatus:
          type: string
          enum: [NORMAL, ELEVATED, CRITICAL]
        locations:
          type: array
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name: { type: string }
              status:
                type: string
                enum: [NORMAL, ELEVATED, CRITICAL]
        symptomReports7d:
          type: array
          description: Aggregate daily counts for the last seven days.
          items:
            type: object
            required: [date, count]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        rkiIncidence:
          type: object
          required: [value, deltaPercent, district]
          additionalProperties: false
          properties:
            value: { type: number }
            deltaPercent: { type: number }
            district: { type: string }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/InsightRecommendation' }

    EmployeeMeasure:
      allOf:
        - $ref: '#/components/schemas/Measure'
        - type: object
          required: [participation]
          properties:
            team:
              type: object
              nullable: true
              properties:
                name: { type: string }
            participation:
              type: object
              required: [isParticipating, participatedAt, verificationType, verifiedAt]
              properties:
                isParticipating: { type: boolean }
                participatedAt: { type: string, format: date-time, nullable: true }
                verificationType:
                  type: string
                  nullable: true
                  enum: [SELF_REPORTED, QR_CHECKIN]
                verifiedAt: { type: string, format: date-time, nullable: true }

    MeasureCheckinTokenResponse:
      type: object
      required: [measureId, token, checkinPath, validFrom, validUntil, revokedAt]
      properties:
        measureId: { type: integer }
        token:
          type: string
          description: Raw token for the newly rotated check-in link. The backend stores only token_hash and never returns token hashes.
        checkinPath:
          type: string
          example: /employee/measure-checkins/abcdef
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    MeasureAlreadyParticipatedError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_ALREADY_PARTICIPATED]
            message:
              type: string

    MeasureNotActiveError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_NOT_ACTIVE]
            message:
              type: string

    MeasureRequiresQrCheckinError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_REQUIRES_QR_CHECKIN]
            message:
              type: string

    MeasureCheckinTokenNotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [CHECKIN_TOKEN_NOT_FOUND]
            message:
              type: string

    MeasureCheckinConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_ALREADY_PARTICIPATED, MEASURE_NOT_ACTIVE, MEASURE_DOES_NOT_ALLOW_QR_CHECKIN, CHECKIN_TOKEN_REVOKED, CHECKIN_TOKEN_NOT_YET_VALID, CHECKIN_TOKEN_EXPIRED]
            message:
              type: string

    MeasureCheckinTokenGenerationConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_NOT_ACTIVE, MEASURE_DOES_NOT_ALLOW_QR_CHECKIN]
            message:
              type: string

    TeamLayerDisabledError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [TEAM_LAYER_DISABLED] }
            message: { type: string }

    PortalForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [PORTAL_FORBIDDEN] }
            message: { type: string }

    CodedForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [FORBIDDEN] }
            message: { type: string }

    MessageForbiddenError:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string }

    LaravelValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    AnonymityThresholdError:
      type: object
      required: [error, minRequired, isAboveThreshold, suppressionReason]
      additionalProperties: false
      properties:
        error: { type: string }
        minRequired: { type: integer }
        isAboveThreshold: { type: boolean }
        suppressionReason:
          type: string
          enum: [ANONYMITY_THRESHOLD_NOT_MET]

    Partner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        type: { type: string }
        verificationStatus: { type: string, enum: [PENDING_DOCS, PENDING_REVIEW, VERIFIED, SUSPENDED, REJECTED] }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                requested_portal: { type: string, enum: [admin, company, employee, partner], nullable: true }
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer, nullable: true }
                      companyName: { type: string, nullable: true }
                      teamId: { type: integer, nullable: true }
                      teamName: { type: string, nullable: true }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                      measureImpactEnabled:
                        type: boolean
                        description: Concept-module flag derived from the API data mode (ELYO_DATA_MODE demo=true, prod=false). Gates the Wirkung column and impact analysis.
                      riskLandscapeEnabled:
                        type: boolean
                        description: Concept-module flag derived from the API data mode. Gates the risk landscape page.
                      usageFunnelEnabled:
                        type: boolean
                        description: Concept-module flag derived from the API data mode. Gates the usage funnel page.
                      infectionRadarEnabled:
                        type: boolean
                        description: Concept-module flag derived from the API data mode. Gates the infection radar page.
                  activePortal: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }
        403:
          description: Requested portal is forbidden
        422:
          description: Validation failure or invalid credentials.

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email }
                  name: { type: string }
                  roles:
                    type: array
                    items: { type: string }
                  companyId: { type: integer, nullable: true }
                  companyName: { type: string, nullable: true }
                  teamLayerEnabled:
                    type: boolean
                    description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                  measureImpactEnabled:
                    type: boolean
                    description: Concept-module flag derived from the API data mode (ELYO_DATA_MODE demo=true, prod=false). Gates the Wirkung column and impact analysis.
                  riskLandscapeEnabled:
                    type: boolean
                    description: Concept-module flag derived from the API data mode. Gates the risk landscape page.
                  usageFunnelEnabled:
                    type: boolean
                    description: Concept-module flag derived from the API data mode. Gates the usage funnel page.
                  infectionRadarEnabled:
                    type: boolean
                    description: Concept-module flag derived from the API data mode. Gates the infection radar page.
                  teamId: { type: integer, nullable: true }
                  teamName: { type: string, nullable: true }
                  activePortal: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new company and admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 2 }
      responses:
        200:
          description: Success
        400:
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/invite/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation
      description: Accepts the persisted invitation only. Request company or team identifiers are ignored; team assignment comes from the invite token and must belong to the invite company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password, password_confirmation]
              properties:
                token: { type: string }
                name: { type: string, maxLength: 255 }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        200:
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                      teamId: { type: integer, nullable: true }
        422:
          description: Invalid invite, company conflict, team conflict, or invalid persisted invite team
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [INVALID_INVITE, COMPANY_CONFLICT, TEAM_CONFLICT, INVALID_INVITE_TEAM]
                      message: { type: string }

  /employee/dashboard:
    get:
      tags: [Employee]
      summary: Get employee dashboard data
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest: { $ref: '#/components/schemas/WellbeingEntry', nullable: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }
                  streakCount: { type: integer }
                  points: { type: integer }
                  todayCheckinCompleted: { type: boolean }
        401:
          description: Unauthorized

  /employee/checkin:
    post:
      tags: [Employee]
      summary: Submit a wellbeing check-in
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mood: { type: integer, minimum: 1, maximum: 10 }
                stress: { type: integer, minimum: 1, maximum: 10 }
                energy: { type: integer, minimum: 1, maximum: 10 }
                note: { type: string, nullable: true }
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  score: { type: number }
                  periodKey: { type: string }
        409:
          description: Check-in already completed for the authenticated employee and current daily period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinAlreadyDoneError'
              example:
                error:
                  code: CHECKIN_ALREADY_DONE
                  message: Der Check-in wurde heute bereits abgeschlossen.

  /employee/checkin/status:
    get:
      tags: [Employee]
      summary: Get daily check-in status
      description: Returns whether the authenticated employee has already completed the check-in for the current daily period.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Daily check-in status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCheckinStatusResponse'
              examples:
                completed:
                  summary: Check-in already completed
                  value:
                    completed: true
                    entry:
                      id: "01JY0000000000000000000001"
                      mood: 8
                      stress: 3
                      energy: 7
                      score: 7.7
                      note: "Guter Start in den Tag."
                      periodKey: "2026-05-25"
                      createdAt: "2026-05-25T08:00:00Z"
                notCompleted:
                  summary: No check-in for the current daily period
                  value:
                    completed: false
                    entry: null
        401:
          description: Unauthorized

  /employee/history:
    get:
      tags: [Employee]
      summary: Get wellbeing history
      security: [{ Sanctum: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }

  /employee/profile:
    get:
      tags: [Employee]
      summary: Get employee profile
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    put:
      tags: [Employee]
      summary: Update employee profile
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        200:
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /employee/measures:
    get:
      tags: [Employee]
      summary: List active measures visible to the authenticated employee
      description: Returns active company-wide measures and active measures targeted to the authenticated employee's current team, including only that employee's participation state.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Visible employee measures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeMeasure'

  /employee/measures/{measure}/participate:
    post:
      tags: [Employee]
      summary: Participate in an active measure
      description: Creates a participation for the authenticated employee. The request body is ignored; user, company, team, and participation time are derived server-side.
      security: [{ Sanctum: [] }]
      parameters:
        - name: measure
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          description: Participation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeMeasure'
        404:
          description: Measure not found or not visible to the authenticated employee
        409:
          description: Duplicate participation, inactive visible measure, or measure requiring QR check-in
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MeasureAlreadyParticipatedError'
                  - $ref: '#/components/schemas/MeasureNotActiveError'
                  - $ref: '#/components/schemas/MeasureRequiresQrCheckinError'

  /employee/measure-checkins/{token}:
    post:
      tags: [Employee]
      summary: Redeem an authenticated QR measure check-in token
      description: Creates a QR_CHECKIN participation for the authenticated employee when the token belongs to a QR_CODE measure. The request body is ignored; user, company, team, participation time, verification type, and points are derived server-side. Employees can only redeem tokens for active measures in their company and team scope.
      security: [{ Sanctum: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          description: QR check-in participation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeMeasure'
        404:
          description: Token not found, measure not found, wrong company, or wrong team scope. All cases return CHECKIN_TOKEN_NOT_FOUND to avoid revealing token state across tenant boundaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureCheckinTokenNotFoundError'
        409:
          description: Lifecycle conflict for an in-scope token only — duplicate participation, inactive measure, self-report-only measure, revoked token, not-yet-valid token, or expired token. Out-of-scope tokens (wrong company or wrong team) are indistinguishable from missing tokens and return 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureCheckinConflictError'

  /employee/surveys:
    get:
      tags: [Employee]
      summary: List available surveys
      description: When the company team layer is disabled, only company-wide surveys are returned; team-targeted surveys are filtered out.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: List of surveys
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string, nullable: true }
                        questionCount: { type: integer }
                        completed: { type: boolean }
                        endsAt: { type: string, format: date-time, nullable: true }

  /employee/surveys/{surveyId}:
