openapi: 3.0.3
info:
  title: ELYO API
  description: API for the ELYO health platform (Migrated from Next.js to Laravel)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Employee
    description: Endpoints for employees (check-ins, dashboard)
  - name: Company
    description: Endpoints for company admins and managers
  - name: Partner
    description: Endpoints for external partners
  - name: Admin
    description: ELYO platform administration
  - name: Measures
    description: Company health measures
  - name: Points
    description: Gamification and points system
  - name: Reports
    description: Data and PDF reports
  - name: Wearables
    description: Wearable device integrations
  - name: Webhooks
    description: External service webhooks
  - name: Cron
    description: Scheduled tasks

components:
  securitySchemes:
    Sanctum:
      type: http
      scheme: bearer
    PartnerSession:
      type: apiKey
      in: cookie
      name: elyo_partner_session
    CronSecret:
      type: apiKey
      in: header
      name: x-cron-secret

  responses:
    TeamLayerDisabled:
      description: Team layer is disabled for this company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamLayerDisabledError'

    PortalForbidden:
      description: User is not eligible for the requested portal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalForbiddenError'

    CompanyPortalForbiddenOrTeamLayerDisabled:
      description: User is not eligible for the company portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

    PortalOrScopeForbidden:
      description: User is not eligible for the requested portal, the requested team-layer workflow is disabled, or the caller is outside the allowed scope
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PortalForbiddenError'
              - $ref: '#/components/schemas/TeamLayerDisabledError'
              - $ref: '#/components/schemas/CodedForbiddenError'
              - $ref: '#/components/schemas/MessageForbiddenError'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true

    ReportingPendingBlock:
      type: object
      description: >-
        Block-level pending state, returned with HTTP 200. Wellbeing data lives in
        the health domain and is keyed on health_subject_id (ADR-003 D3); the company
        runtime has no read path to it and live aggregation is not conform with
        ADR-001 §2.5. These blocks stay empty until the reporting domain (separate
        reporting epic, ADR-003 D7) delivers suppressed quarterly snapshots. No
        partial values and no counts of withheld data are reported.
      required: [status, data]
      properties:
        status: { type: string, enum: [reporting_pending] }
        data:
          type: object
          nullable: true
          enum: [null]
          description: Always null while reporting is pending.

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, enum: [COMPANY_ADMIN, COMPANY_MANAGER, EMPLOYEE, ELYO_ADMIN] }
        isActive: { type: boolean }

    AdminCompany:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold:
          type: integer
          description: Customer-configured threshold. The effective reporting threshold is never lower than the platform minimum of 10.
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.
        users_count: { type: integer, nullable: true }
        created_by_elyo_admin_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminCompanyCreatePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, nullable: true }
        anonymity_threshold:
          type: integer
          minimum: 1
          description: Customer-configured threshold. Values below 10 do not lower the effective platform minimum.
        team_layer_enabled:
          type: boolean
          description: Defaults to false on create when omitted.

    AdminCompanyUpdatePayload:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          maxLength: 255
          description: Optional on update, but must be a non-null string when provided.
        status: { type: string, enum: [active, inactive, suspended] }
        anonymity_threshold:
          type: integer
          minimum: 1
          description: Customer-configured threshold. Values below 10 do not lower the effective platform minimum.
        team_layer_enabled:
          type: boolean
          description: Whether this company uses team-level affiliation and team-scoped manager workflows.

    SystemExerciseType:
      type: string
      enum: [MOBILITY, STRENGTH, BREATHING, MINDFULNESS, EDUCATION, REFLECTION]

    SystemExerciseDifficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    SystemExerciseStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    SystemExerciseTagCategory:
      type: string
      enum: [BODY_REGION, GOAL, SETTING, EQUIPMENT, CONTRAINDICATION, PERSONA_HINT, HEALTH_FOCUS]

    AdminSystemExerciseTag:
      type: object
      properties:
        id: { type: integer }
        category: { $ref: '#/components/schemas/SystemExerciseTagCategory' }
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        isActive: { type: boolean }

    AdminSystemExercise:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          description: Generated server-side from the title on create; never changed on update.
        title: { type: string }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        defaultDurationMinutes: { type: integer, nullable: true }
        defaultSets: { type: integer, nullable: true }
        defaultRepetitions: { type: integer, nullable: true }
        defaultHoldSeconds: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback: { type: boolean }
        status: { $ref: '#/components/schemas/SystemExerciseStatus' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemExerciseTag' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminSystemExerciseCreatePayload:
      type: object
      required: [title, exerciseType, difficulty]
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status:
          allOf:
            - $ref: '#/components/schemas/SystemExerciseStatus'
          description: Defaults to ACTIVE when omitted.
        defaultDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback:
          type: boolean
          description: Defaults to true when omitted.
        tagIds:
          type: array
          description: IDs of existing system exercise tags; the assignment is synced exactly to this list.
          items: { type: integer }

    AdminSystemExerciseUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The slug is never regenerated.
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status: { $ref: '#/components/schemas/SystemExerciseStatus' }
        defaultDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        defaultHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        instructions: { type: string, nullable: true }
        safetyNotes: { type: string, nullable: true }
        contraindications: { type: string, nullable: true }
        defaultFeedbackPrompt: { type: string, nullable: true }
        requiresFeedback: { type: boolean }
        tagIds:
          type: array
          description: When present, tag assignment is synced exactly to this list; when absent, tags are untouched.
          items: { type: integer }

    AdminSystemExerciseListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemExercise' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    SystemMeasureTemplateStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    SystemMeasureTemplateCategory:
      type: string
      enum: [MOBILITY, STRENGTH, BREATHING, MINDFULNESS, EDUCATION, REFLECTION, MIXED]

    AdminSystemMeasureTemplate:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          description: Generated server-side from the title on create; never changed on update.
        title: { type: string }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/SystemMeasureTemplateCategory' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        estimatedDurationMinutes: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/SystemMeasureTemplateStatus' }
        isFeatured: { type: boolean }
        exerciseCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminSystemMeasureTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/AdminSystemMeasureTemplate'
        - type: object
          properties:
            exercises:
              type: array
              description: Template exercises ordered by sortOrder ascending.
              items: { $ref: '#/components/schemas/AdminSystemMeasureTemplateExercise' }

    AdminSystemMeasureTemplateExercise:
      type: object
      properties:
        id: { type: integer }
        systemExerciseId: { type: integer }
        sortOrder: { type: integer }
        customTitle: { type: string, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, nullable: true }
        customSets: { type: integer, nullable: true }
        customRepetitions: { type: integer, nullable: true }
        customHoldSeconds: { type: integer, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired: { type: boolean }
        exercise:
          type: object
          description: Read-only summary of the underlying system exercise.
          properties:
            id: { type: integer }
            slug: { type: string }
            title: { type: string }
            shortDescription: { type: string, nullable: true }
            exerciseType: { $ref: '#/components/schemas/SystemExerciseType' }
            difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
            defaultDurationMinutes: { type: integer, nullable: true }
            status: { $ref: '#/components/schemas/SystemExerciseStatus' }
            tags:
              type: array
              items: { $ref: '#/components/schemas/AdminSystemExerciseTag' }

    AdminSystemMeasureTemplateCreatePayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category:
          allOf:
            - $ref: '#/components/schemas/SystemMeasureTemplateCategory'
          description: Defaults to MIXED when omitted.
        difficulty:
          allOf:
            - $ref: '#/components/schemas/SystemExerciseDifficulty'
          description: Defaults to BEGINNER when omitted.
        status:
          allOf:
            - $ref: '#/components/schemas/SystemMeasureTemplateStatus'
          description: Defaults to ACTIVE when omitted.
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        isFeatured:
          type: boolean
          description: Defaults to false when omitted.

    AdminSystemMeasureTemplateUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The slug is never regenerated.
      properties:
        title: { type: string, maxLength: 255 }
        shortDescription: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/SystemMeasureTemplateCategory' }
        difficulty: { $ref: '#/components/schemas/SystemExerciseDifficulty' }
        status: { $ref: '#/components/schemas/SystemMeasureTemplateStatus' }
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        isFeatured: { type: boolean }

    AdminSystemMeasureTemplateExerciseCreatePayload:
      type: object
      required: [systemExerciseId]
      properties:
        systemExerciseId:
          type: integer
          description: Must reference an existing, non-archived system exercise that is not already part of the template.
        sortOrder:
          type: integer
          minimum: 1
          description: Appended at the end when omitted. An explicitly provided sortOrder that is already taken in the template is rejected with 422; use the reorder endpoint to move multiple exercises.
        customTitle: { type: string, maxLength: 255, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired:
          type: boolean
          description: Defaults to true when omitted.

    AdminSystemMeasureTemplateExerciseUpdatePayload:
      type: object
      description: PATCH semantics — only provided fields are updated. The underlying system exercise is never modified.
      properties:
        sortOrder:
          type: integer
          minimum: 1
          description: An explicitly provided sortOrder that is already taken in the template is rejected with 422; use the reorder endpoint to move multiple exercises.
        customTitle: { type: string, maxLength: 255, nullable: true }
        customInstructions: { type: string, nullable: true }
        customDurationMinutes: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customSets: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customRepetitions: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customHoldSeconds: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        customFeedbackPrompt: { type: string, nullable: true }
        isRequired: { type: boolean }

    AdminSystemMeasureTemplateExercisesReorderPayload:
      type: object
      required: [items]
      description: Must contain the complete set of the template's exercise IDs. Partial payloads (missing IDs) and duplicate sortOrder values are rejected with 422 and no positions are changed. IDs not belonging to the template are rejected with 404.
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, sortOrder]
            properties:
              id:
                type: integer
                description: Template exercise ID belonging to the template.
              sortOrder: { type: integer, minimum: 1 }

    AdminSystemMeasureTemplateListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminSystemMeasureTemplate' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    WellbeingEntry:
      description: >-
        A daily wellbeing check-in on the canonical 1–5 scale (ELYO-102 §3.1, breaking
        change B5 against the former 1–10 scale). The free-text `note` was removed from
        request and response (ELYO-102 §3.3). Entries are stored in the health domain
        keyed on an internal health subject, which is never part of any response.
      type: object
      required: [id, mood, stress, energy, score, periodKey, createdAt]
      properties:
        id:
          type: string
          description: Opaque ULID of the entry. Carries no identity semantics.
          example: 01JY0000000000000000000001
        mood: { type: integer, minimum: 1, maximum: 5 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        energy: { type: integer, minimum: 1, maximum: 5 }
        score:
          type: number
          description: >-
            Mean of mood, inverted stress and energy on the 1–5 scale, rounded to one
            decimal place: `(mood + (6 - stress) + energy) / 3`. Range 1.0–5.0.
          minimum: 1
          maximum: 5
          example: 4.3
        periodKey:
          type: string
          description: Daily period, `YYYY-MM-DD`.
          example: "2026-05-25"
        createdAt: { type: string, format: date-time }
    EmployeeAnamnesis:
      description: >-
        The employee's anamnesis. Stored in the health domain keyed on an internal
        health subject (ELYO-91 prompt 08a, ADR-003 D8), which is never part of any
        response — the anamnesis therefore has no client-visible id of its own.
      type: object
      required: [completionPct, chronicPatterns]
      properties:
        completionPct: { type: integer, minimum: 0, maximum: 100 }
        birthYear: { type: integer, nullable: true }
        biologicalSex:
          type: string
          nullable: true
          enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
        activityLevel: { type: string, nullable: true, maxLength: 80 }
        sleepQuality: { type: string, nullable: true, maxLength: 80 }
        stressTendency: { type: string, nullable: true, maxLength: 80 }
        smokingStatus: { type: string, nullable: true, maxLength: 80 }
        nutritionType: { type: string, nullable: true, maxLength: 80 }
        chronicPatterns:
          type: array
          items: { type: string, maxLength: 120 }
        hasMedication: { type: boolean, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    EmployeeDocument:
      description: >-
        Metadata of a medical document uploaded by the employee. Stored in the health
        domain keyed on an internal health subject (ELYO-91 prompt 08a, ADR-003 D8);
        neither the subject nor the storage key is ever returned.
      type: object
      required: [id, fileName, mimeType, size, uploadedAt]
      properties:
        id:
          type: string
          description: >-
            Opaque ULID of the document. Carries no identity semantics. Before ELYO-91
            prompt 08a this was a numeric identity-side id; the field type was and stays
            an opaque string for clients.
          example: 01JY0000000000000000000002
        fileName: { type: string }
        mimeType: { type: string, example: application/pdf }
        size: { type: integer, description: File size in bytes. }
        uploadedAt: { type: string, format: date-time, nullable: true }

    EmployeeProfile:
      description: >-
        The employee's own profile: identity fields plus the health-domain anamnesis and
        document list, resolved for the authenticated employee only.
      type: object
      required: [id, name, email, anamnesis, anamnesisDue]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        email: { type: string }
        anamnesis:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmployeeAnamnesis'
        anamnesisDue:
          type: boolean
          description: True when no anamnesis exists or the last update is older than six months.
        documents:
          type: array
          description: Newest upload first. Absent from the update response.
          items:
            $ref: '#/components/schemas/EmployeeDocument'

    EmployeeCheckinStatusResponse:
      type: object
      required: [completed, entry]
      properties:
        completed:
          type: boolean
        entry:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WellbeingEntry'

    CheckinAlreadyDoneError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [CHECKIN_ALREADY_DONE]
              example: CHECKIN_ALREADY_DONE
            message:
              type: string
              example: Der Check-in wurde heute bereits abgeschlossen.


    Measure:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        suggestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        measureOrigin:
          type: string
          enum: [COMPANY_CREATED, ELYO_TEMPLATE]
          default: COMPANY_CREATED
          readOnly: true
        deliveryType:
          type: string
          enum: [REMOTE, ONSITE, HYBRID]
          default: ONSITE
        executionType:
          type: string
          enum: [INFORMATION_ONLY, GUIDED_SESSION, SELF_REPORTED_ACTION, EVENT_PARTICIPATION, CHALLENGE]
          default: EVENT_PARTICIPATION
        verificationRequirement:
          type: string
          enum: [SELF_REPORT, QR_CODE]
          default: SELF_REPORT
        visibilityScope:
          type: string
          enum: [COMPANY, TEAM]
          description: Derived server-side from team scope.
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        durationMinutes: { type: integer, nullable: true, minimum: 1 }
        instructions: { type: string, nullable: true, maxLength: 2000 }
        locationName: { type: string, nullable: true, maxLength: 255 }
        locationAddress: { type: string, nullable: true, maxLength: 1000 }
        capacity: { type: integer, nullable: true, minimum: 1 }
        pointsOverride:
          type: integer
          nullable: true
          minimum: 0
          description: Stored for future behavior; current participation points continue to use point settings.

    CompanyMeasurePayload:
      type: object
      properties:
        deliveryType: { type: string, enum: [REMOTE, ONSITE, HYBRID] }
        executionType: { type: string, enum: [INFORMATION_ONLY, GUIDED_SESSION, SELF_REPORTED_ACTION, EVENT_PARTICIPATION, CHALLENGE] }
        verificationRequirement: { type: string, enum: [SELF_REPORT, QR_CODE] }
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 date-time. Clients should send an explicit timezone offset or UTC designator (e.g. 2026-06-20T09:00:00Z); the web UI displays local wall time but always serializes to an explicit UTC instant. Timezone-less values are accepted for backward compatibility and interpreted as UTC.
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 date-time; same timezone semantics as startsAt. Must be strictly after the effective startsAt value when both are present.
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: For scheduled execution types EVENT_PARTICIPATION and GUIDED_SESSION the stored value mirrors the schedule window whenever both effective startsAt and endsAt are present - derived on create or update, overriding any submitted value. When the effective schedule window is incomplete, an explicitly submitted durationMinutes is stored as manual duration (null clears it); a previously derived value is cleared only when a startsAt/endsAt update leaves the window incomplete without submitting durationMinutes. Updates that do not touch startsAt, endsAt, durationMinutes, or executionType leave the stored value unchanged.
        instructions: { type: string, nullable: true, maxLength: 2000 }
        locationName: { type: string, nullable: true, maxLength: 255 }
        locationAddress: { type: string, nullable: true, maxLength: 1000 }
        capacity: { type: integer, nullable: true, minimum: 1 }
        pointsOverride: { type: integer, nullable: true, minimum: 0 }

    CompanyMeasureCreatePayload:
      allOf:
        - $ref: '#/components/schemas/CompanyMeasurePayload'
        - type: object
          required: [title, category, description]
          properties:
            title: { type: string, minLength: 3, maxLength: 100 }
            category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
            description: { type: string, minLength: 10, maxLength: 500 }
            teamId: { type: integer, nullable: true }
            status: { type: string, enum: [SUGGESTED, ACTIVE] }

    CompanyMeasureUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/CompanyMeasurePayload'
        - type: object
          properties:
            title: { type: string, minLength: 3, maxLength: 100 }
            category: { type: string, enum: [workshop, flexibility, sport, mental, nutrition] }
            description: { type: string, minLength: 10, maxLength: 500 }
            status: { type: string, enum: [ACTIVE, COMPLETED, DISMISSED] }

    MeasureParticipationSummary:
      type: object
      required:
        - measureId
        - isAboveThreshold
        - eligibleCount
        - participantCount
        - participationRate
        - suppressionReason
        - teamBreakdown
      additionalProperties: false
      properties:
        measureId: { type: integer }
        isAboveThreshold: { type: boolean }
        eligibleCount:
          type: integer
          nullable: true
          description: Null when anonymity threshold suppression applies.
        participantCount:
          type: integer
          nullable: true
          description: Null when anonymity threshold suppression applies.
        participationRate:
          type: number
          nullable: true
          description: Percentage of scoped eligible employees who participated, null when suppressed.
        suppressionReason:
          type: string
          nullable: true
          enum: [ANONYMITY_THRESHOLD_NOT_MET]
        teamBreakdown:
          type: array
          nullable: true
          description: Nullable future field. Current backend responses return null; non-null array data is reserved for a future privacy-reviewed team breakdown feature.
          items:
            type: object
            additionalProperties: false
            properties:
              teamId: { type: integer }
              teamName: { type: string }
              isAboveThreshold: { type: boolean }
              eligibleCount: { type: integer, nullable: true }
              participantCount: { type: integer, nullable: true }
              participationRate: { type: number, nullable: true }
              suppressionReason: { type: string, nullable: true }
            description: Always null for this measure-level aggregate endpoint.

    EmployeeMeasure:
      allOf:
        - $ref: '#/components/schemas/Measure'
        - type: object
          required: [participation]
          properties:
            team:
              type: object
              nullable: true
              properties:
                name: { type: string }
            participation:
              type: object
              required: [isParticipating, participatedAt, verificationType, verifiedAt]
              properties:
                isParticipating: { type: boolean }
                participatedAt: { type: string, format: date-time, nullable: true }
                verificationType:
                  type: string
                  nullable: true
                  enum: [SELF_REPORTED, QR_CHECKIN]
                verifiedAt: { type: string, format: date-time, nullable: true }

    MeasureCheckinTokenResponse:
      type: object
      required: [measureId, token, checkinPath, validFrom, validUntil, revokedAt]
      properties:
        measureId: { type: integer }
        token:
          type: string
          description: Raw token for the newly rotated check-in link. The backend stores only token_hash and never returns token hashes.
        checkinPath:
          type: string
          example: /employee/measure-checkins/abcdef
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    MeasureAlreadyParticipatedError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_ALREADY_PARTICIPATED]
            message:
              type: string

    MeasureNotActiveError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_NOT_ACTIVE]
            message:
              type: string

    MeasureRequiresQrCheckinError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_REQUIRES_QR_CHECKIN]
            message:
              type: string

    MeasureCheckinTokenNotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [CHECKIN_TOKEN_NOT_FOUND]
            message:
              type: string

    MeasureCheckinConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_ALREADY_PARTICIPATED, MEASURE_NOT_ACTIVE, MEASURE_DOES_NOT_ALLOW_QR_CHECKIN, CHECKIN_TOKEN_REVOKED, CHECKIN_TOKEN_NOT_YET_VALID, CHECKIN_TOKEN_EXPIRED]
            message:
              type: string

    MeasureCheckinTokenGenerationConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MEASURE_NOT_ACTIVE, MEASURE_DOES_NOT_ALLOW_QR_CHECKIN]
            message:
              type: string

    TeamLayerDisabledError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [TEAM_LAYER_DISABLED] }
            message: { type: string }

    PortalForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [PORTAL_FORBIDDEN] }
            message: { type: string }

    CodedForbiddenError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [FORBIDDEN] }
            message: { type: string }

    MessageForbiddenError:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string }

    LaravelValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    CheckinValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code: { type: string, enum: [VALIDATION_ERROR] }
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    AnonymityThresholdError:
      type: object
      required: [error, minRequired, isAboveThreshold, suppressionReason]
      additionalProperties: false
      properties:
        error: { type: string }
        minRequired:
          type: integer
          minimum: 10
          description: Effective anonymity threshold after applying the platform minimum of 10.
        isAboveThreshold: { type: boolean }
        suppressionReason:
          type: string
          enum: [ANONYMITY_THRESHOLD_NOT_MET]

    Partner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        type: { type: string }
        verificationStatus: { type: string, enum: [PENDING_DOCS, PENDING_REVIEW, VERIFIED, SUSPENDED, REJECTED] }

    LabMarkerStatus:
      type: string
      description: >-
        Soft status with stable technical keys per ELYO-102 §1.2, derived from the
        orientation range and never stored. Display wording is a frontend/catalog concern
        (ELYO-94) and deliberately not part of the contract. These are not diagnostic
        statements.
      enum: [below_range, in_range, above_range]

    LabMarkerSource:
      type: string
      description: >-
        Provenance per ELYO-102 §1.4. The MVP writes `manual` only; `document_import` and
        `bgm_import` are reserved so later import paths can be added additively. The value
        is server-set and never accepted from a client.
      enum: [manual, document_import, bgm_import]

    LabMarkerGroup:
      type: string
      description: Catalog grouping per ELYO-102 §1.1.
      enum: [blutbild, immun, mikro, sonstige]

    LabMarkerReading:
      type: object
      description: One lab reading with its catalog metadata, per ELYO-102 §1.1.
      required: [id, markerKey, name, unit, value, measuredAt, status, low, high, group, source]
      additionalProperties: false
      properties:
        id: { type: string, description: Opaque ULID of the reading. }
        markerKey: { type: string, example: ferritin }
        name: { type: string, example: Ferritin }
        unit: { type: string, example: ng/ml }
        value: { type: number, example: 42.125 }
        measuredAt: { type: string, format: date, example: "2026-07-20" }
        status: { $ref: '#/components/schemas/LabMarkerStatus' }
        low:
          type: number
          nullable: true
          description: Lower orientation bound; content candidate pending ELYO-94 review.
        high:
          type: number
          nullable: true
          description: Upper orientation bound; content candidate pending ELYO-94 review.
        group: { $ref: '#/components/schemas/LabMarkerGroup' }
        source: { $ref: '#/components/schemas/LabMarkerSource' }

    LabMarkerHistoryEntry:
      type: object
      description: One history entry of a single marker, per ELYO-102 §1.3.
      required: [id, markerKey, value, measuredAt, status, source]
      additionalProperties: false
      properties:
        id: { type: string, description: Opaque ULID of the reading. }
        markerKey: { type: string, example: ferritin }
        value: { type: number, example: 42.125 }
        measuredAt: { type: string, format: date, example: "2026-07-20" }
        status: { $ref: '#/components/schemas/LabMarkerStatus' }
        source: { $ref: '#/components/schemas/LabMarkerSource' }

    LabMarkerHistoryResponse:
      type: object
      description: Chronologically ascending history page (ELYO-102 §1.3).
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LabMarkerHistoryEntry' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    LabMarkerNotFoundError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [LAB_MARKER_NOT_FOUND] }
            message: { type: string }

    LabReadingNotFoundError:
      type: object
      description: >-
        Returned for a reading that does not exist and for a reading owned by another
        health subject — the two cases are deliberately indistinguishable (ELYO-102 §1.5).
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [LAB_READING_NOT_FOUND] }
            message: { type: string }

    LabMarkerValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code: { type: string, enum: [VALIDATION_ERROR] }
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                requested_portal: { type: string, enum: [admin, company, employee, partner], nullable: true }
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer, nullable: true }
                      companyName: { type: string, nullable: true }
                      teamId: { type: integer, nullable: true }
                      teamName: { type: string, nullable: true }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                  activePortal: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }
        403:
          description: Requested portal is forbidden
        422:
          description: Validation failure or invalid credentials.

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email }
                  name: { type: string }
                  roles:
                    type: array
                    items: { type: string }
                  companyId: { type: integer, nullable: true }
                  companyName: { type: string, nullable: true }
                  teamLayerEnabled:
                    type: boolean
                    description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                  teamId: { type: integer, nullable: true }
                  teamName: { type: string, nullable: true }
                  activePortal: { type: string, nullable: true }
                  allowedPortals:
                    type: array
                    items: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new company and admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 2 }
      responses:
        200:
          description: Success
        400:
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/invite/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation
      description: Accepts the persisted invitation only. Request company or team identifiers are ignored; team assignment comes from the invite token and must belong to the invite company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password, password_confirmation]
              properties:
                token: { type: string }
                name: { type: string, maxLength: 255 }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        200:
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      companyId: { type: integer }
                      teamLayerEnabled:
                        type: boolean
                        description: Whether this company uses team-level affiliation and team-scoped manager workflows.
                      teamId: { type: integer, nullable: true }
        422:
          description: Invalid invite, company conflict, team conflict, or invalid persisted invite team
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [INVALID_INVITE, COMPANY_CONFLICT, TEAM_CONFLICT, INVALID_INVITE_TEAM]
                      message: { type: string }

  /employee/dashboard:
    get:
      tags: [Employee]
      summary: Get employee dashboard data
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest: { $ref: '#/components/schemas/WellbeingEntry', nullable: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }
                  streakCount: { type: integer }
                  points: { type: integer }
                  todayCheckinCompleted: { type: boolean }
        401:
          description: Unauthorized

  /employee/checkin:
    post:
      tags: [Employee]
      summary: Submit a wellbeing check-in
      description: >-
        One check-in per employee and daily period. `mood`, `stress` and `energy` are
        required integers on the canonical 1–5 scale (ELYO-102 §3.1 / B3); values outside
        1–5 return 422. The free-text `note` is no longer accepted; every occurrence,
        including null or empty values, is rejected with 422 rather than silently dropped
        (ELYO-102 §3.3 / B4), so an outdated client cannot lose text the employee believed
        was stored. `location` and `sleep` are not part of this contract version (ELYO-133).
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mood, stress, energy]
              properties:
                mood: { type: integer, minimum: 1, maximum: 5 }
                stress: { type: integer, minimum: 1, maximum: 5 }
                energy: { type: integer, minimum: 1, maximum: 5 }
                note:
                  description: Removed free-text field; any supplied value, including null or empty values, is invalid.
                  not: {}
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [success, score, periodKey]
                properties:
                  success: { type: boolean }
                  score:
                    type: number
                    description: >-
                      `(mood + (6 - stress) + energy) / 3`, rounded to one decimal place.
                  periodKey: { type: string, example: "2026-05-25" }
        403:
          description: The authenticated employee does not belong to a company.
        409:
          description: Check-in already completed for the authenticated employee and current daily period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinAlreadyDoneError'
              example:
                error:
                  code: CHECKIN_ALREADY_DONE
                  message: Der Check-in wurde heute bereits abgeschlossen.
        422:
          description: Validation failed — off-scale value, missing field, or a supplied `note`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinValidationError'
              examples:
                outOfRange:
                  summary: Value outside the canonical 1–5 scale
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The given data was invalid.
                      details:
                        mood: ["The mood field must not be greater than 5."]
                noteProhibited:
                  summary: Removed free-text field supplied
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The given data was invalid.
                      details:
                        note: ["Freitext-Notizen werden im Check-in nicht mehr erfasst."]

  /employee/checkin/status:
    get:
      tags: [Employee]
      summary: Get daily check-in status
      description: Returns whether the authenticated employee has already completed the check-in for the current daily period.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Daily check-in status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCheckinStatusResponse'
              examples:
                completed:
                  summary: Check-in already completed
                  value:
                    completed: true
                    entry:
                      id: "01JY0000000000000000000001"
                      mood: 4
                      stress: 2
                      energy: 4
                      score: 4.0
                      periodKey: "2026-05-25"
                      createdAt: "2026-05-25T08:00:00Z"
                notCompleted:
                  summary: No check-in for the current daily period
                  value:
                    completed: false
                    entry: null
        401:
          description: Unauthorized

  /employee/history:
    get:
      tags: [Employee]
      summary: Get wellbeing history
      security: [{ Sanctum: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/WellbeingEntry' }

  /employee/profile:
    get:
      tags: [Employee]
      summary: Get employee profile
      description: >-
        Returns the authenticated employee's identity fields together with their own
        anamnesis and uploaded documents. Anamnesis and documents live in the health
        domain and are resolved for the caller's own health subject only (ELYO-91
        prompt 08a, ADR-003 D8); another employee's data is never reachable here.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EmployeeProfile' }
    put:
      tags: [Employee]
      summary: Update employee profile
      description: >-
        Updates the display name and the anamnesis. `completionPct` is derived from the
        filled anamnesis fields and cannot be set by the client. The response omits
        `documents`.
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                birthYear: { type: integer, nullable: true, minimum: 1900 }
                biologicalSex:
                  type: string
                  nullable: true
                  enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
                activityLevel: { type: string, nullable: true, maxLength: 80 }
                sleepQuality: { type: string, nullable: true, maxLength: 80 }
                stressTendency: { type: string, nullable: true, maxLength: 80 }
                smokingStatus: { type: string, nullable: true, maxLength: 80 }
                nutritionType: { type: string, nullable: true, maxLength: 80 }
                chronicPatterns:
                  type: array
                  nullable: true
                  items: { type: string, maxLength: 120 }
                hasMedication: { type: boolean, nullable: true }
      responses:
        200:
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EmployeeProfile' }
        422:
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelValidationError'

  /employee/documents:
    post:
      tags: [Employee]
      summary: Upload a medical document
      description: >-
        Stores a PDF (max 10 MB) for the authenticated employee. Metadata is written in
        the health domain on the caller's own health subject (ELYO-91 prompt 08a,
        ADR-003 D8) and the file is stored subject-scoped, so no storage path carries
        identity data. Bucket separation, signed URLs and virus scanning are the
        ADR-001 §2.9 storage hardening follow-up.
      security: [{ Sanctum: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file, maximum 10240 KB.
      responses:
        201:
          description: Document stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EmployeeDocument' }
        422:
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelValidationError'

  /employee/measures:
    get:
      tags: [Employee]
      summary: List active measures visible to the authenticated employee
      description: Returns active company-wide measures and active measures targeted to the authenticated employee's current team, including only that employee's participation state.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Visible employee measures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeMeasure'

  /employee/measures/{measure}/participate:
    post:
      tags: [Employee]
      summary: Participate in an active measure
      description: Creates a participation for the authenticated employee. The request body is ignored; user, company, team, and participation time are derived server-side.
      security: [{ Sanctum: [] }]
      parameters:
        - name: measure
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          description: Participation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeMeasure'
        404:
          description: Measure not found or not visible to the authenticated employee
        409:
          description: Duplicate participation, inactive visible measure, or measure requiring QR check-in
          content:
