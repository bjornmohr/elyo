    get:
      tags: [Company]
      summary: Get measure statistics aggregated by risk field
      description: Returns one row per canonical risk field. In prod data mode measureCount and avgParticipationRate are computed from the database with the same visibility scoping as the measures list (team layer, manager scope) and server-side anonymity threshold enforcement; avgImpactRating and fieldTrend30d are null. In demo data mode the rows come from the deterministic per-company demo dataset.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Statistics per risk field
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeasureFieldStatistics'
        403:
          $ref: '#/components/responses/CompanyPortalForbiddenOrTeamLayerDisabled'

  /company/measures/{id}/execution:
    get:
      tags: [Company]
      summary: Get execution details for a measure
      description: Fully derived from existing measure, participation and check-in token data; independent of the demo/prod data mode. registeredCount is suppressed (null) below the anonymity threshold.
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Execution details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MeasureExecution'
        403:
          $ref: '#/components/responses/CompanyPortalForbiddenOrTeamLayerDisabled'
        404:
          description: Measure not found in the authenticated company scope

  /company/measures/{id}/impact:
    get:
      tags: [Company]
      summary: Get impact analysis for a measure (concept)
      description: Concept endpoint behind the measureImpactEnabled flag. Demo data mode returns deterministic demo values for COMPLETED measures and data null otherwise; prod data mode always returns data null until the extended check-in ships. Anonymity threshold applies to both comparison groups.
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Impact analysis or null when unavailable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/MeasureImpact'
        403:
          $ref: '#/components/responses/CompanyPortalForbiddenOrTeamLayerDisabled'
        404:
          description: Measure not found in the authenticated company scope

  /company/risk-landscape:
    get:
      tags: [Company]
      summary: Get risk landscape (concept)
      description: Concept endpoint behind the riskLandscapeEnabled flag. Demo data mode returns the deterministic per-company demo landscape; prod data mode returns data as an empty array until the extended check-in ships.
      security: [{ Sanctum: [] }]
      responses:
        200:
          description: Risk landscape or empty array when unavailable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/RiskLandscape'
