        422:
          description: Laravel validation error for invalid or missing request fields, including required fields, string length constraints, invalid enum values, unsupported verificationRequirement values, invalid date formats, invalid date ranges, invalid integer values, invalid team payloads, or TEAM_LAYER_DISABLED for teamId payloads when the company team layer is disabled
          content:
