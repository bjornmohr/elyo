  /company/measures/{id}:
    patch:
      tags: [Company]
      summary: Update measure status and domain fields
      description: Team-scoped measures are rejected with TEAM_LAYER_DISABLED when the company team layer is disabled.
      security: [{ Sanctum: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMeasureUpdatePayload'
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Measure' }
        400:
          description: Invalid measure status transition. Returned for any disallowed status value in the payload, including status-only updates on COMPLETED or DISMISSED measures; non-status field edits on those measures return 422 keyed to status instead.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_transition]
        403:
          $ref: '#/components/responses/CompanyPortalForbiddenOrTeamLayerDisabled'
        404:
          description: Measure not found for the authenticated company user
        422:
          description: Laravel validation error for invalid request fields, including string length constraints, invalid enum values, unsupported verificationRequirement values, invalid date formats, invalid partial date ranges against persisted values (effective endsAt must be strictly after effective startsAt), or invalid integer values. Also returned when mutable fields are edited on COMPLETED or DISMISSED measures (status-only transition attempts return 400 invalid_transition instead), or when verificationRequirement is changed after participations exist. Scoped authorization is evaluated first - out-of-scope measures return 403/404 and never leak date validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelValidationError'

