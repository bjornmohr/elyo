services:
  # Angular Frontend
  web:
    build:
      context: ./apps/web-angular
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./apps/web-angular:/app
      - angular_node_modules:/app/node_modules
    environment:
      - NG_APP_API_URL=http://localhost:8080/api
    networks:
      - elyo-network

  # Laravel API (PHP-FPM)
  api:
    build:
      context: ./apps/api-laravel
      dockerfile: Dockerfile
    volumes:
      - ./apps/api-laravel:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      # Domain-separated connections (ELYO-104). Each carries its own PG role;
      # the OS/DB boundary — not PHP — enforces access.
      - DB_CONNECTION=identity
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_IDENTITY_DATABASE=elyo_identity
      - DB_IDENTITY_USERNAME=elyo_identity_rt
      - DB_IDENTITY_PASSWORD=${ELYO_IDENTITY_RT_PASSWORD:-identity_rt_dev}
      - DB_MAPPING_DATABASE=elyo_subject_mapping
      - DB_MAPPING_USERNAME=elyo_mapping_svc
      - DB_MAPPING_PASSWORD=${ELYO_MAPPING_SVC_PASSWORD:-mapping_svc_dev}
      - DB_HEALTH_DATABASE=elyo_health
      - DB_HEALTH_USERNAME=elyo_employee_rt
      - DB_HEALTH_PASSWORD=${ELYO_EMPLOYEE_RT_PASSWORD:-employee_rt_dev}
      - DB_AUDIT_DATABASE=elyo_audit
      - DB_AUDIT_USERNAME=elyo_employee_rt
      - DB_AUDIT_PASSWORD=${ELYO_EMPLOYEE_RT_PASSWORD:-employee_rt_dev}
      - REDIS_HOST=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    networks:
      - elyo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Nginx Proxy for Laravel
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/api-laravel:/var/www
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - elyo-network
    depends_on:
      - api

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      # Legacy bootstrap DB/superuser (kept for BC; n8n still uses it).
      - POSTGRES_DB=${DB_DATABASE:-elyo}
      - POSTGRES_USER=${DB_USERNAME:-elyo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-elyo_secret}
      # Runtime-role passwords consumed by the initdb script (dev defaults;
      # override via Docker secrets outside local development).
      - ELYO_IDENTITY_RT_PASSWORD=${ELYO_IDENTITY_RT_PASSWORD:-identity_rt_dev}
      - ELYO_EMPLOYEE_RT_PASSWORD=${ELYO_EMPLOYEE_RT_PASSWORD:-employee_rt_dev}
      - ELYO_COMPANY_RT_PASSWORD=${ELYO_COMPANY_RT_PASSWORD:-company_rt_dev}
      - ELYO_MAPPING_SVC_PASSWORD=${ELYO_MAPPING_SVC_PASSWORD:-mapping_svc_dev}
      - ELYO_MIGRATOR_PASSWORD=${ELYO_MIGRATOR_PASSWORD:-migrator_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-elyo} -d ${DB_DATABASE:-elyo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elyo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - elyo-network

  # Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_DATABASE:-elyo}
      - DB_POSTGRESDB_USER=${DB_USERNAME:-elyo}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-elyo_secret}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - elyo-network
    depends_on:
      postgres:
        condition: service_healthy

  # SMTP Testing
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    networks:
      - elyo-network

  # Optional Legacy Next.js (using ../ELYO)
  legacy-next:
    image: node:18-alpine
    profiles: ["legacy"]
    working_dir: /app
    volumes:
      - ../ELYO:/app:ro
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    networks:
      - elyo-network

networks:
  elyo-network:
    driver: bridge

volumes:
  postgres_data:
  angular_node_modules:
  n8n_data:
