# ELYO local stack.
#
# Runtime split (ADR-001 §2.4, ADR-003 D2): the Laravel API runs as three
# separate containers built from ONE image. Each container selects its route
# subset and its connection allowlist via ELYO_RUNTIME and carries ONLY the
# PostgreSQL credentials its domain needs. nginx routes by path prefix, so
# Angular keeps a single base URL (http://localhost:8080/api).
#
# There is no aggregator/gateway container and no runtime-to-runtime traffic.
# The migrator role never appears in a runtime container; schema work happens
# in the one-shot `migrate` service.

# Shared build definition. All API containers resolve to the same image tag, so
# the image is built once and reused by every runtime.
x-api-build: &api-build
  image: elyo-api-laravel:local
  build:
    context: ./apps/api-laravel
    dockerfile: Dockerfile

# Source bind mount. One mount shared by every API container (dev hot reload).
# vendor/ is installed in the image; the bind mount shadows it with the host
# copy, so `composer install` is run once on the host or via api-tooling — the
# alternative (a named volume per runtime) would triple disk usage for no gain.
x-api-volumes: &api-volumes
  - ./apps/api-laravel:/var/www

# Environment shared by every API container. Credentials are deliberately NOT
# part of this block — each service adds only its own role.
x-api-env: &api-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: identity
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"

x-api-depends: &api-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  # Angular Frontend
  web:
    build:
      context: ./apps/web-angular
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./apps/web-angular:/app
      - angular_node_modules:/app/node_modules
    environment:
      - NG_APP_API_URL=http://localhost:8080/api
    networks:
      - elyo-network

  # ---------------------------------------------------------------------------
  # API runtimes — one image, three profiles, three credential sets
  # ---------------------------------------------------------------------------

  # Identity runtime: /api/auth/*, /api/admin/*, /api/partner/*, /api/health.
  # Holds elyo_identity_rt only — no mapping, no health, no migrator credentials.
  api-identity:
    <<: *api-build
    environment:
      <<: *api-env
      ELYO_RUNTIME: identity
      DB_IDENTITY_DATABASE: elyo_identity
      DB_IDENTITY_USERNAME: elyo_identity_rt
      DB_IDENTITY_PASSWORD: ${ELYO_IDENTITY_RT_PASSWORD:?ELYO_IDENTITY_RT_PASSWORD must be set}
      DB_AUDIT_DATABASE: elyo_audit
      DB_AUDIT_USERNAME: elyo_identity_rt
      DB_AUDIT_PASSWORD: ${ELYO_IDENTITY_RT_PASSWORD:?ELYO_IDENTITY_RT_PASSWORD must be set}
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # Employee runtime: /api/employee/*, /api/health.
  # Holds elyo_employee_rt (identity read, health, audit) and elyo_mapping_svc
  # (mapping connection + mapping key material). No migrator, no company role.
  api-employee:
    <<: *api-build
    environment:
      <<: *api-env
      ELYO_RUNTIME: employee
      DB_IDENTITY_DATABASE: elyo_identity
      DB_IDENTITY_USERNAME: elyo_employee_rt
      DB_IDENTITY_PASSWORD: ${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}
      DB_MAPPING_DATABASE: elyo_subject_mapping
      DB_MAPPING_USERNAME: elyo_mapping_svc
      DB_MAPPING_PASSWORD: ${ELYO_MAPPING_SVC_PASSWORD:?ELYO_MAPPING_SVC_PASSWORD must be set}
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY:-}
      MAPPING_HMAC_KEY: ${MAPPING_HMAC_KEY:-}
      MAPPING_SUBJECT_DERIVATION_KEY: ${MAPPING_SUBJECT_DERIVATION_KEY:-}
      DB_HEALTH_DATABASE: elyo_health
      DB_HEALTH_USERNAME: elyo_employee_rt
      DB_HEALTH_PASSWORD: ${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}
      DB_AUDIT_DATABASE: elyo_audit
      DB_AUDIT_USERNAME: elyo_employee_rt
      DB_AUDIT_PASSWORD: ${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # Company runtime: /api/company/*, /api/health.
  # Holds elyo_company_rt only — no mapping, no health, no migrator credentials
  # and no mapping key material (ADR-001 §2.10).
  api-company:
    <<: *api-build
    environment:
      <<: *api-env
      ELYO_RUNTIME: company
      DB_IDENTITY_DATABASE: elyo_identity
      DB_IDENTITY_USERNAME: elyo_company_rt
      DB_IDENTITY_PASSWORD: ${ELYO_COMPANY_RT_PASSWORD:?ELYO_COMPANY_RT_PASSWORD must be set}
      DB_AUDIT_DATABASE: elyo_audit
      DB_AUDIT_USERNAME: elyo_company_rt
      DB_AUDIT_PASSWORD: ${ELYO_COMPANY_RT_PASSWORD:?ELYO_COMPANY_RT_PASSWORD must be set}
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # ---------------------------------------------------------------------------
  # Schema and tooling — never deployed alongside the runtimes
  # ---------------------------------------------------------------------------

  # One-shot migrator. `docker compose run --rm migrate`.
  # The ONLY container that ever sees elyo_migrator. Behind the `tools` profile
  # so `docker compose up` never starts it; `docker compose run` activates the
  # profile automatically.
  migrate:
    <<: *api-build
    profiles: ["tools"]
    restart: "no"
    environment:
      <<: *api-env
      ELYO_RUNTIME: full
      # Every connection runs as elyo_migrator: DDL for all four domains plus
      # the seeders, which write through the identity connection and provision
      # subjects through the mapping connection.
      DB_IDENTITY_DATABASE: elyo_identity
      DB_IDENTITY_USERNAME: elyo_migrator
      DB_IDENTITY_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
      DB_MAPPING_DATABASE: elyo_subject_mapping
      DB_MAPPING_USERNAME: elyo_migrator
      DB_MAPPING_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
      DB_HEALTH_DATABASE: elyo_health
      DB_HEALTH_USERNAME: elyo_migrator
      DB_HEALTH_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
      DB_AUDIT_DATABASE: elyo_audit
      DB_AUDIT_USERNAME: elyo_migrator
      DB_AUDIT_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
      DB_MIGRATOR_USERNAME: elyo_migrator
      DB_MIGRATOR_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY:-}
      MAPPING_HMAC_KEY: ${MAPPING_HMAC_KEY:-}
      MAPPING_SUBJECT_DERIVATION_KEY: ${MAPPING_SUBJECT_DERIVATION_KEY:-}
    command: ["php", "artisan", "elyo:migrate-fresh", "--seed"]
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # LOCAL DEVELOPMENT ONLY — never deploy this service.
  # Runs ELYO_RUNTIME=full so the whole test suite (which needs all connections
  # and all routes) has a home: `docker compose exec api-tooling php artisan test`.
  # It is the one container that holds every credential, which is exactly why it
  # has no ports, no nginx upstream and no place in any deployed topology.
  api-tooling:
    <<: *api-build
    profiles: ["tools"]
    environment:
      <<: *api-env
      ELYO_RUNTIME: full
      DB_IDENTITY_DATABASE: elyo_identity
      DB_IDENTITY_USERNAME: elyo_identity_rt
      DB_IDENTITY_PASSWORD: ${ELYO_IDENTITY_RT_PASSWORD:?ELYO_IDENTITY_RT_PASSWORD must be set}
      DB_MAPPING_DATABASE: elyo_subject_mapping
      DB_MAPPING_USERNAME: elyo_mapping_svc
      DB_MAPPING_PASSWORD: ${ELYO_MAPPING_SVC_PASSWORD:?ELYO_MAPPING_SVC_PASSWORD must be set}
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY:-}
      MAPPING_HMAC_KEY: ${MAPPING_HMAC_KEY:-}
      MAPPING_SUBJECT_DERIVATION_KEY: ${MAPPING_SUBJECT_DERIVATION_KEY:-}
      DB_HEALTH_DATABASE: elyo_health
      DB_HEALTH_USERNAME: elyo_employee_rt
      DB_HEALTH_PASSWORD: ${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}
      DB_AUDIT_DATABASE: elyo_audit
      DB_AUDIT_USERNAME: elyo_employee_rt
      DB_AUDIT_PASSWORD: ${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}
      ELYO_COMPANY_RT_PASSWORD: ${ELYO_COMPANY_RT_PASSWORD:?ELYO_COMPANY_RT_PASSWORD must be set}
      DB_MIGRATOR_USERNAME: elyo_migrator
      DB_MIGRATOR_PASSWORD: ${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}
    command: ["sleep", "infinity"]
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # ---------------------------------------------------------------------------
  # Prepared, not implemented (ADR-003 D2). `docker compose --profile future up`
  # starts idle placeholders only — neither has a worker or an HTTP entry point
  # yet, and neither is wired into nginx.
  # ---------------------------------------------------------------------------

  # Reporting worker: consumes the (still empty) elyo_reporting database once the
  # reporting domain exists. No credentials assigned yet on purpose.
  reporting-worker:
    <<: *api-build
    profiles: ["future"]
    environment:
      <<: *api-env
      ELYO_RUNTIME: full
    command: ["sleep", "infinity"]
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # Privacy runtime: future home of retention enforcement and data-subject
  # requests (the only place allowed to hold audit_migrator). Placeholder only.
  api-privacy:
    <<: *api-build
    profiles: ["future"]
    environment:
      <<: *api-env
      ELYO_RUNTIME: full
    command: ["sleep", "infinity"]
    volumes: *api-volumes
    networks:
      - elyo-network
    depends_on: *api-depends

  # ---------------------------------------------------------------------------

  # Nginx: single public entry point, routes /api/* to the matching runtime.
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/api-laravel:/var/www
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - elyo-network
    depends_on:
      - api-identity
      - api-employee
      - api-company

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      # Legacy bootstrap DB/superuser (kept for BC; n8n still uses it).
      - POSTGRES_DB=${DB_DATABASE:-elyo}
      - POSTGRES_USER=${DB_USERNAME:-elyo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-elyo_secret}
      # Runtime-role passwords consumed by the initdb script. All are required
      # so Compose stops rather than silently using a development password.
      - "ELYO_IDENTITY_RT_PASSWORD=${ELYO_IDENTITY_RT_PASSWORD:?ELYO_IDENTITY_RT_PASSWORD must be set}"
      - "ELYO_EMPLOYEE_RT_PASSWORD=${ELYO_EMPLOYEE_RT_PASSWORD:?ELYO_EMPLOYEE_RT_PASSWORD must be set}"
      - "ELYO_COMPANY_RT_PASSWORD=${ELYO_COMPANY_RT_PASSWORD:?ELYO_COMPANY_RT_PASSWORD must be set}"
      - "ELYO_MAPPING_SVC_PASSWORD=${ELYO_MAPPING_SVC_PASSWORD:?ELYO_MAPPING_SVC_PASSWORD must be set}"
      - "ELYO_MIGRATOR_PASSWORD=${ELYO_MIGRATOR_PASSWORD:?ELYO_MIGRATOR_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-elyo} -d ${DB_DATABASE:-elyo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elyo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - elyo-network

  # Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_DATABASE:-elyo}
      - DB_POSTGRESDB_USER=${DB_USERNAME:-elyo}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-elyo_secret}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - elyo-network
    depends_on:
      postgres:
        condition: service_healthy

  # SMTP Testing
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    networks:
      - elyo-network

  # Optional Legacy Next.js (using ../ELYO)
  legacy-next:
    image: node:18-alpine
    profiles: ["legacy"]
    working_dir: /app
    volumes:
      - ../ELYO:/app:ro
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    networks:
      - elyo-network

networks:
  elyo-network:
    driver: bridge

volumes:
  postgres_data:
  angular_node_modules:
  n8n_data:
