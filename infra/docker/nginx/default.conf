# ELYO runtime split (ADR-001 §2.4, ADR-003 D2).
#
# One public base URL (http://localhost:8080/api) in front of three Laravel
# runtime containers built from the same image. The path prefix decides which
# FastCGI upstream serves the request:
#
#   /api/employee/*  -> api-employee
#   /api/company/*   -> api-company
#   everything else  -> api-identity  (/api/auth/*, /api/admin/*,
#                                      /api/partner/*, /api/health, static)
#
# Cross-path requests are not rewritten or proxied on: a runtime that does not
# own the prefix simply has no such route and answers 404. No aggregator, no
# runtime-to-runtime traffic.
#
# No header exposing the runtime topology is added to responses or upstream
# requests — the split stays invisible to clients (only the standard FastCGI
# parameters are forwarded).

# Docker's embedded DNS, re-resolved per request.
#
# Static `upstream` blocks would resolve the service names once at config load
# and cache them forever. Recreating a runtime container gives it a new IP, and
# nginx would keep sending to the old address — which by then may belong to a
# DIFFERENT runtime. That misroutes /api/employee traffic into the company
# container (or vice versa), so this is a correctness and privacy problem, not
# a convenience one. `valid=` bounds how long a stale mapping can survive.
resolver 127.0.0.11 ipv6=off valid=10s;

# Matched against the original request URI, because Laravel's front controller
# rewrite would otherwise turn every path into /index.php before the FastCGI
# location is evaluated.
map $request_uri $elyo_api_upstream {
    default                     api-identity:9000;
    ~^/api/employee(?:[/?]|$)   api-employee:9000;
    ~^/api/company(?:[/?]|$)    api-company:9000;
}

server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $elyo_api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
